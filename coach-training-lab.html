<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>מעבדת האימון | המרכז שלי</title>
  <meta name="theme-color" content="#101512">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="app-icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="coach-training-lab.css">
</head>
<body class="training-lab-page">
<div class="app training-lab-app" data-training-lab-root>
  <div class="training-lab-back">
    <a class="btn small" href="coach.html">← מאמן</a>
    <a class="btn small" href="volleyball.html">🏐 כדורעף</a>
  </div>

  <header class="training-lab-hero">
    <p class="training-lab-kicker">COACH TRAINING LAB</p>
    <h1>🧪 מעבדת האימון</h1>
    <p>תרגילים, עקרונות, מחקר ושפת אימון — עם הסבר מקצועי למאמן וגרסה שאפשר להגיד לילדים על המגרש.</p>
  </header>

  <section class="training-lab-now" aria-labelledby="training-lab-now-title">
    <div class="training-lab-section-head">
      <div><p class="training-lab-kicker">צריך משהו עכשיו?</p><h2 id="training-lab-now-title">בנה התאמה מהירה לאימון</h2></div>
    </div>
    <form id="training-lab-now-form" class="training-lab-now-form">
      <label>מספר שחקנים<input name="players" type="number" min="1" max="30" inputmode="numeric" placeholder="12"></label>
      <label>כיתה<select name="grade"><option value="">לא משנה</option><option>ב</option><option>ג</option><option>ד</option><option>ה</option><option>ו</option><option>ז</option><option>ח</option><option>ט</option><option>י</option><option>יא</option><option>יב</option></select></label>
      <label>רמה<select name="level"><option value="">לא משנה</option><option value="beginner">מתחילים</option><option value="developing">מתפתחים</option><option value="intermediate">ביניים</option><option value="advanced">מתקדמים</option></select></label>
      <label>זמן בדקות<input name="minutes" type="number" min="3" max="90" inputmode="numeric" placeholder="15"></label>
      <label>נושא<select name="topic"><option value="">לא משנה</option><option value="reception">קבלה</option><option value="defense">הגנה</option><option value="serve">הגשה</option><option value="attack">התקפה</option><option value="block">חסימה</option><option value="setting">הרמה</option><option value="perception">קבלת החלטות</option><option value="power-jump">כוח וקפיצה</option></select></label>
      <button type="submit" class="training-lab-primary">מצא לי 2–4 אפשרויות</button>
    </form>
    <div id="training-lab-now-results" class="training-lab-now-results" aria-live="polite"></div>
  </section>

  <section class="training-lab-discovery" aria-labelledby="training-lab-discovery-title">
    <div class="training-lab-section-head"><div><p class="training-lab-kicker">חיפוש וידע</p><h2 id="training-lab-discovery-title">מצא תרגיל או עיקרון</h2></div><strong id="training-lab-count" aria-live="polite"></strong></div>
    <label class="training-lab-search-label" for="training-lab-search">חיפוש חופשי</label>
    <input id="training-lab-search" class="training-lab-search" type="search" placeholder="קבלה כיתה ה, קריאת תוקף, קפיצה, משוב...">
    <div id="training-lab-filters" class="training-lab-filters" aria-label="מסנני מעבדת האימון"></div>
    <div id="training-lab-results" class="training-lab-results" aria-live="polite"></div>
  </section>

  <section class="training-lab-saved-grid">
    <article><h2>★ שמורים</h2><div id="training-lab-favorites" class="training-lab-saved-list"></div></article>
    <article><h2>🏐 האימון הבא</h2><div id="training-lab-next-practice" class="training-lab-saved-list"></div></article>
  </section>

  <section id="training-lab-detail" class="training-lab-detail" hidden aria-live="polite"></section>

  <nav class="bottom-nav"><div class="inner">
    <a class="nav-item" href="index.html"><span>🏠</span>בית</a>
    <a class="nav-item" href="raika.html"><span>⚡</span>ראיקה</a>
    <a class="nav-item active" href="coach.html"><span>🧠</span>מאמן</a>
    <a class="nav-item" href="volleyball.html"><span>🏐</span>כדורעף</a>
    <a class="nav-item" href="languages.html"><span>🌍</span>שפות</a>
    <a class="nav-item" href="library.html"><span>📚</span>ספרייה</a>
  </div></nav>
</div>
<script src="coach-training-lab-data.js"></script>
<script src="coach-training-lab.js"></script>
<script src="app.js"></script>
<script src="mobile-app-shell.js?v=1"></script>
</body>
</html>
