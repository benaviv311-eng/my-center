<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081122">
  <title>DOUBLE — האתגר היומי</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,Arial,sans-serif;background:#07101f;color:#fff}button{font:inherit}
    body{overflow:hidden;background:radial-gradient(circle at 50% -10%,#355ecb44,transparent 35%),radial-gradient(circle at 10% 85%,#f5b6331f,transparent 30%),linear-gradient(160deg,#060b18,#0d1832 58%,#101631)}
    .daily{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:14px 18px 18px;position:relative;overflow:hidden}.daily:before{content:"";position:absolute;inset:-20%;background-image:radial-gradient(circle,#fff 1px,transparent 1.4px);background-size:52px 52px;opacity:.08;animation:drift 24s linear infinite;pointer-events:none}@keyframes drift{to{transform:translate(52px,52px)}}
    header{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.title{text-align:center}.title small{display:block;opacity:.65;font-weight:800;font-size:11px}.title h1{margin:2px 0 0;font-size:clamp(23px,4vw,36px);letter-spacing:.01em}.badge{justify-self:start;padding:8px 11px;border-radius:999px;background:#ffd84d16;border:1px solid #ffd84d50;color:#ffe88a;font-weight:1000;font-size:12px}.back{justify-self:end;width:45px;height:45px;border-radius:15px;border:1px solid #ff6b7f66;background:#ff6b7f10;color:#ff8e9e;font-size:24px;cursor:pointer}
    .hud{position:relative;z-index:2;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.pill{min-width:108px;padding:8px 12px;border-radius:16px;background:#07101fae;border:1px solid #ffffff17;backdrop-filter:blur(8px);text-align:center;font-weight:900;font-size:11px}.pill b{display:block;font-size:22px;margin-top:2px}.pill.gold{border-color:#ffd84d55;background:#ffd84d0e}.pill.fire{border-color:#ff875d44;background:#ff875d0b}
    .arena{position:relative;z-index:2;min-height:0;display:grid;place-items:center}.cards{width:min(940px,98vw);height:min(560px,64vh);position:relative}.card{position:absolute;top:50%;width:clamp(235px,32vw,390px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 32%,#fff,#f7f9ff 58%,#dce5f2);border:7px solid #ffffffc8;box-shadow:0 30px 90px #0009,inset 0 0 0 3px #31537b1d;transform:translateY(-50%);transition:.2s}.card.left{left:1%;transform:translateY(-50%) rotate(-3deg)}.card.right{right:1%;transform:translateY(-50%) rotate(3deg)}.symbol{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%) rotate(var(--r));width:64px;height:64px;border:0;background:transparent;display:grid;place-items:center;font-size:clamp(31px,4vw,52px);cursor:pointer;filter:drop-shadow(0 4px 4px #0002);transition:.12s}.symbol:hover{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.14)}.symbol.good{animation:good .34s ease}.symbol.bad{animation:bad .28s ease}@keyframes good{50%{filter:drop-shadow(0 0 18px #4dffac);transform:translate(-50%,-50%) rotate(var(--r)) scale(1.3)}}@keyframes bad{25%,75%{transform:translate(calc(-50% - 7px),-50%) rotate(var(--r))}50%{transform:translate(calc(-50% + 7px),-50%) rotate(var(--r));filter:drop-shadow(0 0 12px #ff5c77)}}
    .message{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);padding:9px 15px;border-radius:999px;background:#050b18c9;border:1px solid #ffffff20;font-weight:900;font-size:12px;min-width:190px;text-align:center;opacity:0;transition:.18s;pointer-events:none}.message.show{opacity:1}
    footer{position:relative;z-index:2;text-align:center;font-size:11px;opacity:.62;font-weight:800}.finish{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:#030816d9;backdrop-filter:blur(12px)}.finish.open{display:grid}.finish-card{width:min(470px,94vw);padding:26px;border-radius:28px;background:linear-gradient(180deg,#172448,#0b142d);border:1px solid #ffffff20;box-shadow:0 30px 90px #000c;text-align:center}.finish-card .cup{font-size:58px}.finish-card h2{font-size:34px;margin:8px 0 2px}.finish-card .result{font-size:46px;font-weight:1000;color:#ffd84d;margin:8px 0}.finish-card p{opacity:.72;font-weight:700}.finish-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.finish-stat{padding:10px;border-radius:15px;background:#ffffff0a;border:1px solid #ffffff12}.finish-stat b{display:block;font-size:20px}.finish-stat small{opacity:.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{border:0;border-radius:16px;padding:13px;font-weight:1000;cursor:pointer}.again{background:#ffd84d;color:#161616}.home{background:#ffffff12;color:#fff;border:1px solid #ffffff1d!important}
    @media(max-width:700px){.daily{padding:9px}.cards{height:58vh}.card{width:54vw;opacity:.95}.card.left{left:-11vw}.card.right{right:-11vw}.symbol{width:54px;height:54px}header{grid-template-columns:auto 1fr auto}.badge{font-size:10px}.title h1{font-size:23px}.pill{min-width:90px;padding:6px 9px}.pill b{font-size:18px}}
    @media(prefers-reduced-motion:reduce){.daily:before{animation:none}.symbol.good,.symbol.bad{animation:none}}
  </style>
</head>
<body>
  <main class="daily">
    <header>
      <button class="back" id="backBtn" type="button" aria-label="חזרה">←</button>
      <div class="title"><small id="dateLabel"></small><h1>🏆 האתגר היומי</h1></div>
      <div class="badge">אותו רצף לכולם</div>
    </header>
    <div class="hud">
      <div class="pill gold">התקדמות<b id="progress">0/15</b></div>
      <div class="pill">⏱️ זמן<b id="timer">0.00</b></div>
      <div class="pill fire">🔥 רצף ימים<b id="streak">0</b></div>
      <div class="pill">⚠️ קנסות<b id="penalties">0</b></div>
      <div class="pill">👑 שיא היום<b id="best">—</b></div>
    </div>
    <section class="arena"><div class="cards" id="cards"></div><div class="message" id="message"></div></section>
    <footer>15 התאמות · כל טעות מוסיפה 2 שניות · אין ערבוב ואין שינוי קושי</footer>
  </main>
  <section class="finish" id="finish" aria-hidden="true"><div class="finish-card"><div class="cup">🏆</div><h2>האתגר הושלם!</h2><div class="result" id="finalTime">0.00</div><p id="finalText"></p><div class="finish-grid"><div class="finish-stat"><b id="finishStreak">0</b><small>🔥 רצף ימים</small></div><div class="finish-stat"><b id="finishDays">0</b><small>📅 ימים הושלמו</small></div><div class="finish-stat"><b id="finishPenalty">0</b><small>⚠️ קנסות</small></div></div><div class="actions"><button class="home" id="homeBtn" type="button">← חזרה</button><button class="again" id="againBtn" type="button">🔄 נסה שוב</button></div></div></section>
  <script src="double/daily-challenge-core.js?v=10"></script>
  <script src="double/stats-store.js?v=10"></script>
  <script src="double/daily-challenge-game.js?v=10"></script>
  <script src="double/encouragement-engine.js?v=16"></script>
  <script src="double/reaction-time-model.js?v=16"></script>
  <script src="double/encouragement-bridge.js?v=16"></script>
  <script src="double/reaction-time-bridge.js?v=16"></script>
</body>
</html>
