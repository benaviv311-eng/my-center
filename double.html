<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15152a">
  <title>DOUBLE</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Arial,sans-serif;background:radial-gradient(circle at top,#35356c,#111126 70%);color:#fff;min-height:100vh}
    button{font:inherit;touch-action:manipulation;pointer-events:auto;-webkit-tap-highlight-color:transparent}
    .app{max-width:760px;margin:auto;padding:12px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
    .logo{font-size:27px;font-weight:1000}
    .mode-name{font-size:13px;opacity:.72;font-weight:800}
    .stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .pill{background:#ffffff18;border:1px solid #ffffff25;border-radius:18px;padding:7px 10px;font-weight:900}
    .p1{outline:2px solid #55c8ff}.p2{outline:2px solid #ff6b91}
    .challenge{text-align:center;font-weight:800;margin:8px 0 3px}
    .hint{text-align:center;opacity:.75;margin:3px 0 8px}
    .board{display:grid;gap:12px;justify-items:center}
    .card{width:min(84vw,345px);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 10px 35px #0008,inset 0 0 0 8px #eee;position:relative;overflow:hidden}
    .sym{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:7px;line-height:1;cursor:pointer;display:grid;place-items:center;min-width:48px;min-height:48px}
    .sym:active{scale:.92}
    .glyph{display:inline-block;will-change:transform}
    .glyph.spinning{animation:spin linear infinite}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.glyph.spinning{animation:none!important}}
    .controls,.modes{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}
    button.action{border:0;border-radius:16px;padding:11px 16px;font-weight:900;font-size:16px;cursor:pointer}
    .primary{background:#ffd84d;color:#171717}.secondary{background:#fff;color:#171717}.blue{background:#55c8ff}.pink{background:#ff6b91}
    .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);font-size:25px;font-weight:1000;pointer-events:none;z-index:6;text-align:center}
    .start{position:fixed;inset:0;background:linear-gradient(#22224f,#0e0e22);display:grid;place-items:center;z-index:4;padding:18px;overflow:auto}
    .panel{text-align:center;padding:24px;max-width:620px;width:min(100%,620px)}
    .panel h1{font-size:52px;margin:0 0 6px}
    .panel p{opacity:.82}
    .big{font-size:18px!important;padding:14px 20px!important}
    .turn{text-align:center;font-size:20px;font-weight:1000;margin:6px}
    .mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
    .mode-card{border:0;border-radius:18px;padding:16px 13px;min-height:88px;text-align:right;cursor:pointer;color:#171717;display:grid;gap:5px;align-content:center}
    .mode-card b{font-size:19px}.mode-card small{font-size:13px;line-height:1.3;opacity:.75;font-weight:700}
    .mode-card.classic{background:#ffd84d}.mode-card.levels{background:#b8a6ff}.mode-card.knockout{background:#ff9b76}.mode-card.survival{background:#7ee0b8}.mode-card.versus{background:#55c8ff;grid-column:1/-1}
    .menu-note{font-size:13px}
    .difficulty-wrap{margin:16px 0 4px;display:grid;gap:8px}
    .difficulty-wrap>span{font-size:14px;font-weight:900;opacity:.82}
    .difficulty-picker{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
    .difficulty-picker button{border:1px solid #ffffff30;background:#ffffff12;color:#fff;border-radius:14px;padding:9px 16px;font-weight:900;cursor:pointer}
    .difficulty-picker button.active{background:#ffd84d;color:#171717;border-color:#ffd84d}
    .best-strip{margin:10px auto 4px;padding:9px 12px;border-radius:14px;background:#ffffff12;border:1px solid #ffffff20;font-size:13px;font-weight:800;max-width:520px}
    .boss-card{box-shadow:0 0 0 5px #ffd84d,0 10px 35px #0008,inset 0 0 0 8px #eee}
    .boss-pill{background:#ffd84d;color:#171717;border-color:#ffd84d}

    .profile-line{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:8px 0 14px;font-size:13px;opacity:.9}
    .progress-card{background:#ffffff10;border:1px solid #ffffff20;border-radius:18px;padding:14px;margin:10px 0 14px;text-align:right}
    .progress-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}
    .progress-bar{height:9px;border-radius:999px;background:#ffffff18;overflow:hidden}
    .progress-bar i{display:block;height:100%;background:#ffd84d;border-radius:999px}
    .stage-map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:13px 0}
    .stage-node{min-height:46px;border:1px solid #ffffff28;background:#ffffff10;color:#fff;border-radius:14px;font-weight:1000;display:grid;place-items:center;gap:1px;cursor:pointer}
    .stage-node span{font-size:13px}
    .stage-node.done{background:#7ee0b8;color:#111;border-color:#7ee0b8}
    .stage-node.current{background:#ffd84d;color:#111;border-color:#ffd84d;outline:3px solid #ffffff25}
    .stage-node.boss{border-radius:50%}
    .stage-node:disabled{opacity:.28;cursor:not-allowed}
    .score-rules{display:grid;gap:5px;text-align:right;margin:12px 0;padding:12px 14px;border-radius:16px;background:#ffffff0d;border:1px solid #ffffff18}
    .score-rules span,.score-rules small{font-size:13px;line-height:1.45;opacity:.85}
    .combo-pill{background:#ffdf70;color:#171717;border-color:#ffdf70}
    .compact-rules{margin-top:14px}
    .submenu-head{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;margin-bottom:12px}
    .submenu-head h2{margin:0;font-size:28px}
    .submenu-head small{opacity:.72}
  
    .encouragement{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%) scale(.7);z-index:20;pointer-events:none;font-weight:1000;letter-spacing:.04em;text-shadow:0 4px 18px #0009;opacity:0;animation:encourage .72s ease-out}
    .encouragement.level-1{font-size:clamp(30px,8vw,56px)}
    .encouragement.level-2{font-size:clamp(36px,10vw,68px)}
    .encouragement.level-3{font-size:clamp(44px,12vw,82px)}
    .encouragement.level-4{font-size:clamp(52px,14vw,96px)}
    @keyframes encourage{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}72%{opacity:1;transform:translate(-50%,-58%) scale(1)}100%{opacity:0;transform:translate(-50%,-72%) scale(.9)}}
    .coin-pop{position:fixed;z-index:22;pointer-events:none;font-size:30px;transform:translate(-50%,-50%);animation:coinBurst .95s cubic-bezier(.2,.8,.2,1) forwards}
    .coin-amount{position:fixed;z-index:23;pointer-events:none;font-size:24px;font-weight:1000;transform:translate(-50%,-50%);text-shadow:0 3px 12px #000b;animation:coinAmount .9s ease-out forwards}
    @keyframes coinBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}70%{opacity:1;transform:translate(calc(-50% + var(--coin-x)),calc(-50% + var(--coin-y))) scale(1.18) rotate(240deg)}100%{opacity:0;transform:translate(calc(-50% + var(--coin-x)),calc(-50% + var(--coin-y) - 24px)) scale(.75) rotate(360deg)}}
    @keyframes coinAmount{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}25%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-150%) scale(.95)}}
    @media (prefers-reduced-motion:reduce){.encouragement,.coin-pop,.coin-amount{animation-duration:.01ms!important}}
      @media(min-width:760px){.board{grid-template-columns:1fr 1fr}.card{width:340px}}
    @media(max-width:520px){.mode-grid{grid-template-columns:1fr}.mode-card.versus{grid-column:auto}.panel h1{font-size:44px}.stats{justify-content:center}.top{justify-content:center;text-align:center}}
  </style>
  <link rel="stylesheet" href="site-chat.css?v=2">\n  <link rel="stylesheet" href="site-editor-ui.css?v=1">\n</head>
<body>
  <div id="start" class="start">
    <div id="menuPanel" class="panel">
      <h1>DOUBLE</h1>
      <p>מצא את הסמל המשותף בין שני הקלפים</p>

      <div class="difficulty-wrap">
        <span>רמת קושי</span>
        <div class="difficulty-picker">
          <button type="button" data-difficulty="easy">קל</button>
          <button type="button" data-difficulty="normal">בינוני</button>
          <button type="button" data-difficulty="hard">קשה</button>
        </div>
      </div>

      <div class="best-strip" id="bestStrip">השיאים שלך יופיעו כאן</div>

      <div class="mode-grid">
        <button type="button" class="mode-card classic" data-mode="classic"><b>⚡ קלאסי</b><small>ניקוד ורצף · הזמן משתנה לפי הרמה</small></button>
        <button type="button" class="mode-card levels" data-mode="levels"><b>🚀 שלבים</b><small>כל שלב קשה יותר · כל שלב 5 הוא בוס 👑</small></button>
        <button type="button" class="mode-card knockout" data-mode="knockout"><b>🎯 נוקאאוט</b><small>יעד התאמות בתוך זמן מוגבל</small></button>
        <button type="button" class="mode-card survival" data-mode="survival"><b>🛡️ הישרדות</b><small>כל הצלחה מוסיפה זמן</small></button>
        <button type="button" class="mode-card versus" data-mode="versus"><b>👥 שני שחקנים</b><small>ראש בראש על אותו מסך</small></button>
      </div>
      <p class="menu-note">השיאים נשמרים במכשיר בנפרד לכל רמת קושי.</p>
    </div>
  </div>

  <div class="app">
    <div class="top">
      <div>
        <div class="logo">DOUBLE</div>
        <div id="modeName" class="mode-name"></div>
      </div>
      <div id="stats" class="stats"></div>
    </div>
    <div id="challengeText" class="challenge"></div>
    <div id="turn" class="turn"></div>
    <div class="hint">לחץ על הסמל הזהה</div>
    <div id="board" class="board"></div>
    <div id="playerButtons" class="controls"></div>
    <div class="controls">
      <button type="button" id="shuffleBtn" class="action secondary">ערבב</button>
      <button type="button" id="menuBtn" class="action secondary">← חזור</button>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="double/game.js?v=9"></script>\n  <script src="site-editor-ui.js?v=1"></script>\n  <script src="site-chat.js?v=2"></script>
</body>
</html>
