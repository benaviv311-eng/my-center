<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15152a"><title>DOUBLE</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:radial-gradient(circle at top,#35356c,#111126 70%);color:white;min-height:100vh}.app{max-width:760px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-size:27px;font-weight:1000}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#ffffff18;border:1px solid #ffffff25;border-radius:18px;padding:7px 10px;font-weight:900}.p1{outline:2px solid #55c8ff}.p2{outline:2px solid #ff6b91}.hint{text-align:center;opacity:.85;margin:7px}.board{display:grid;gap:12px;justify-items:center}.card{width:min(84vw,345px);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 10px 35px #0008,inset 0 0 0 8px #eee;position:relative;overflow:hidden}.sym{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:5px;line-height:1;cursor:pointer;filter:drop-shadow(0 2px 1px #0002)}.sym:active{scale:.9}.controls,.modes{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}button.action{border:0;border-radius:16px;padding:11px 16px;font-weight:900;font-size:16px}button{touch-action:manipulation;pointer-events:auto;-webkit-tap-highlight-color:transparent}.start,.panel,.modes{pointer-events:auto}.primary{background:#ffd84d}.secondary{background:#fff}.blue{background:#55c8ff}.pink{background:#ff6b91}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);font-size:25px;font-weight:1000;pointer-events:none;z-index:6}.start{position:fixed;inset:0;background:linear-gradient(#22224f,#0e0e22);display:grid;place-items:center;z-index:4}.panel{text-align:center;padding:30px;max-width:520px}.panel h1{font-size:52px;margin:0}.panel p{opacity:.8}.big{font-size:20px!important;padding:15px 24px!important}.turn{text-align:center;font-size:20px;font-weight:1000;margin:6px}@media(min-width:760px){.board{grid-template-columns:1fr 1fr}.card{width:340px}}</style></head><body><div id="start" class="start"><div class="panel"><h1>DOUBLE</h1><p>מצא את הסמל המשותף בין שני הקלפים</p><div class="modes"><button type="button" id="startSingle" class="action primary big">👤 שחקן יחיד</button><button type="button" id="startDouble" class="action blue big">👥 שני שחקנים</button></div><p>בשני שחקנים: בוחרים מי מצא ואז לוחצים על הסמל</p></div></div><div class="app"><div class="top"><div class="logo">DOUBLE</div><div id="stats" class="stats"></div></div><div id="turn" class="turn"></div><div class="hint">לחץ על הסמל הזהה</div><div id="board" class="board"></div><div id="playerButtons" class="controls"></div><div class="controls"><button type="button" id="shuffleBtn" class="action secondary">ערבב</button><button type="button" id="menuBtn" class="action secondary">תפריט</button></div></div><div id="toast" class="toast"></div><script src="double/game.js?v=2"></script></body></html>
