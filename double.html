<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15152a"><title>DOUBLE</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:radial-gradient(circle at top,#35356c,#111126 70%);color:white;min-height:100vh}.app{max-width:760px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-size:27px;font-weight:1000}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#ffffff18;border:1px solid #ffffff25;border-radius:18px;padding:7px 10px;font-weight:900}.p1{outline:2px solid #55c8ff}.p2{outline:2px solid #ff6b91}.hint{text-align:center;opacity:.85;margin:7px}.board{display:grid;gap:12px;justify-items:center}.card{width:min(84vw,345px);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 10px 35px #0008,inset 0 0 0 8px #eee;position:relative;overflow:hidden}.sym{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:5px;line-height:1;cursor:pointer;filter:drop-shadow(0 2px 1px #0002)}.sym:active{scale:.9}.controls,.modes{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}button.action{border:0;border-radius:16px;padding:11px 16px;font-weight:900;font-size:16px}.primary{background:#ffd84d}.secondary{background:#fff}.blue{background:#55c8ff}.pink{background:#ff6b91}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);font-size:25px;font-weight:1000;pointer-events:none;z-index:6}.start{position:fixed;inset:0;background:linear-gradient(#22224f,#0e0e22);display:grid;place-items:center;z-index:4}.panel{text-align:center;padding:30px;max-width:520px}.panel h1{font-size:52px;margin:0}.panel p{opacity:.8}.big{font-size:20px!important;padding:15px 24px!important}.turn{text-align:center;font-size:20px;font-weight:1000;margin:6px}@media(min-width:760px){.board{grid-template-columns:1fr 1fr}.card{width:340px}}</style></head><body><div id="start" class="start"><div class="panel"><h1>DOUBLE</h1><p>מצא את הסמל המשותף בין שני הקלפים</p><div class="modes"><button class="action primary big" onclick="startGame(1)">👤 שחקן יחיד</button><button class="action blue big" onclick="startGame(2)">👥 שני שחקנים</button></div><p>בשני שחקנים: בוחרים מי מצא ואז לוחצים על הסמל</p></div></div><div class="app"><div class="top"><div class="logo">DOUBLE</div><div id="stats" class="stats"></div></div><div id="turn" class="turn"></div><div class="hint">לחץ על הסמל הזהה</div><div id="board" class="board"></div><div id="playerButtons" class="controls"></div><div class="controls"><button class="action secondary" onclick="newRound()">ערבב</button><button class="action secondary" onclick="showMenu()">תפריט</button></div></div><div id="toast" class="toast"></div><script>
const icons=['🐶','🐱','🦁','🐘','🐵','🐼','🐧','🐟','🍕','🍎','🍌','🍉','🍦','🍩','🍔','🍓','⚽','🏀','🏐','🎾','🏆','🎯','🛹','🚗','✈️','🚲','🚀','🚂','🚢','☀️','🌙','⭐','🌈','☁️','⚡','🔥','🌸','❤️','👑','💎','😊','👻','💩','🎸','🎁','🔑','⏰','💡','📷','🎈','🤖','🦄','👽','🐉','🧙','🏰','🏴‍☠️'];
let deck=[],pair=[],mode=1,score=0,streak=0,scores=[0,0],time=60,timer=null,active=false,claim=null;
function buildDeck(){let lines=[];for(let m=0;m<7;m++)for(let b=0;b<7;b++){let a=[];for(let x=0;x<7;x++)a.push(x*7+((m*x+b)%7));a.push(49+m);lines.push(a)}for(let b=0;b<7;b++){let a=[];for(let y=0;y<7;y++)a.push(b*7+y);a.push(56);lines.push(a)}lines.push([49,50,51,52,53,54,55,56]);return lines}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(m){mode=m;document.getElementById('start').style.display='none';score=0;streak=0;scores=[0,0];time=60;active=true;claim=null;deck=shuffle(buildDeck());clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)end()},1000);buttons();update();newRound()}
function buttons(){let e=document.getElementById('playerButtons');if(mode===2)e.innerHTML='<button class="action blue" onclick="claimPlayer(0)">🔵 שחקן 1 מצא!</button><button class="action pink" onclick="claimPlayer(1)">🔴 שחקן 2 מצא!</button>';else e.innerHTML=''}
function claimPlayer(p){if(!active)return;claim=p;document.getElementById('turn').textContent='שחקן '+(p+1)+' — לחץ על ההתאמה!'}
function newRound(){if(!active)return;claim=null;document.getElementById('turn').textContent=mode===2?'מי מוצא ראשון?':'';let a=deck[Math.floor(Math.random()*deck.length)],b;do b=deck[Math.floor(Math.random()*deck.length)];while(b===a);pair=[a,b];render()}
const spots=[[50,16],[27,30],[70,31],[48,43],[22,58],[76,60],[39,76],[62,80]];
function render(){let board=document.getElementById('board');board.innerHTML='';pair.forEach(card=>{let el=document.createElement('div');el.className='card';shuffle(card).forEach((id,i)=>{let p=spots[i],bt=document.createElement('button');bt.className='sym';bt.textContent=icons[id];bt.style.left=p[0]+'%';bt.style.top=p[1]+'%';bt.style.fontSize=(36+Math.random()*18)+'px';bt.style.transform='translate(-50%,-50%) rotate('+(-25+Math.random()*50)+'deg)';bt.onclick=()=>hit(id);el.appendChild(bt)});board.appendChild(el)})}
function hit(id){if(mode===2&&claim===null){flash('בחרו קודם מי מצא');return}let common=pair[0].find(x=>pair[1].includes(x));if(id===common){if(mode===1){score+=10+streak*2;streak++}else{scores[claim]++;flash('✓ נקודה לשחקן '+(claim+1));}if(mode===1)flash('✓ מצאת!');newRound()}else{if(mode===1){score=Math.max(0,score-3);streak=0}else{scores[claim]=Math.max(0,scores[claim]-1);flash('✕ טעות לשחקן '+(claim+1));claim=null;document.getElementById('turn').textContent='מי מוצא ראשון?'}update()}
function flash(t){let e=document.getElementById('toast');e.textContent=t;clearTimeout(e._t);e._t=setTimeout(()=>e.textContent='',650)}
function update(){let s=document.getElementById('stats');s.innerHTML=mode===1?'<div class="pill">🔥 '+streak+'</div><div class="pill">⭐ '+score+'</div><div class="pill">⏱️ '+time+'</div>':'<div class="pill p1">🔵 '+scores[0]+'</div><div class="pill">⏱️ '+time+'</div><div class="pill p2">🔴 '+scores[1]+'</div>'}
function end(){active=false;clearInterval(timer);let result=mode===1?'<h1>'+score+'</h1><p>הניקוד שלך</p>':(scores[0]===scores[1]?'<h1>תיקו!</h1><p>'+scores[0]+' : '+scores[1]+'</p>':'<h1>🏆 שחקן '+(scores[0]>scores[1]?1:2)+'</h1><p>'+scores[0]+' : '+scores[1]+'</p>');document.getElementById('start').style.display='grid';document.querySelector('.panel').innerHTML=result+'<button class="action primary big" onclick="location.reload()">משחק חדש</button>'}
function showMenu(){location.reload()}
deck=buildDeck();
</script></body></html>
