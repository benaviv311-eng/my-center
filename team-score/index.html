<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TeamScore">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>TeamScore</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{display:grid;place-items:center}
#load{padding:24px;text-align:center;font-weight:800}
small{display:block;margin-top:8px;color:#94a3b8;font-weight:500}
</style>
</head>
<body>
<div id="load">TeamScore<small>טוען את האפליקציה…</small></div>
<script>
(async function(){
  const VERSION="33";
  const tnames=["t1.txt","t2.txt","t3.txt","t4.txt"];
  const bnames=["b1.txt","b2.txt","b3.txt","b4.txt"];
  const read=async n=>{const r=await fetch(n+"?v="+VERSION,{cache:"no-store"});if(!r.ok)throw new Error(n+" "+r.status);return r.text()};
  const [parts,bgs]=await Promise.all([
    Promise.all(tnames.map(read)),
    Promise.all(bnames.map(read))
  ]);
  const bin=atob(parts.join(""));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==="undefined")throw new Error("הדפדפן ישן מדי");
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  let html=await new Response(stream).text();

  // Keep legacy placeholders available to the app, but do not use the small
  // portrait WebPs as the visible full-screen background.
  bgs.forEach((b,i)=>{html=html.replaceAll("__BG"+(i+1)+"__","data:image/webp;base64,"+b.trim())});

  // Apply the approved portrait image directly to the live app shell.
  // This cannot be hidden by an opaque full-screen wrapper above the page background.
  html=html
    .replace(/<link[^>]+href=["'][^"']*backgrounds\\.css[^"']*["'][^>]*>/gi,"")
    .replace(/<script[^>]+src=["'][^"']*backgrounds\\.js[^"']*["'][^>]*>\\s*<\\/script>/gi,"");

  const bgImgs=[
    'assets/mobile/p1.webp?v='+VERSION,
    'assets/mobile/p2.webp?v='+VERSION,
    'assets/mobile/p3.webp?v='+VERSION,
    'assets/mobile/p4.webp?v='+VERSION
  ];

  const shellCss='<style id="teamScoreShellBgCss">'+
    'html,body{min-height:100%!important;background:#11151d!important}'+
    '.rotating-bg{display:none!important}'+
    '</style>';

  const shellJs='<script>(function(){'+
    'var imgs='+JSON.stringify(bgImgs)+',i=0,target=null;'+
    'function area(el){var r=el.getBoundingClientRect();return Math.max(0,r.width)*Math.max(0,r.height)}'+
    'function pick(){'+
      'target=document.querySelector(".wrap")||document.querySelector(".app-shell")||document.querySelector(".app")||document.querySelector("#app");'+
      'if(!target){var all=[].slice.call(document.body.querySelectorAll("div,main,section"));var best=null,bestA=0;all.forEach(function(el){var r=el.getBoundingClientRect();if(r.width>=innerWidth*.85&&r.height>=innerHeight*.75){var a=area(el);if(a>bestA){best=el;bestA=a}}});target=best||document.body;}'+
      'return target;'+
    '}'+
    'function apply(){var el=target||pick();if(!el)return;'+
      'el.style.setProperty("background-image","url(\\\""+imgs[i]+"\\\")","important");'+
      'el.style.setProperty("background-size","cover","important");'+
      'el.style.setProperty("background-position","center center","important");'+
      'el.style.setProperty("background-repeat","no-repeat","important");'+
      'document.body.style.setProperty("background-color","#11151d","important");'+
    '}'+
    'imgs.forEach(function(s){var x=new Image();x.src=s});'+
    'function boot(){pick();apply();setTimeout(apply,250);setTimeout(apply,1000);}'+
    'if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot,{once:true});else boot();'+
    'setInterval(function(){i=(i+1)%imgs.length;apply()},15000);'+
    'addEventListener("resize",function(){target=null;setTimeout(apply,80)},{passive:true});'+
  '})();<\\/script>';

  html=html.replace("</head>",shellCss+"</head>").replace("</body>",shellJs+"</body>");
  html=html.replaceAll("icon-192.png","icon.svg").replaceAll("icon-512.png","icon.svg");
  document.open();document.write(html);document.close();
})().catch(e=>{
  document.getElementById("load").innerHTML="לא הצלחתי לטעון את TeamScore<small>"+String(e.message||e)+"</small>";
});
</script>
</body>
</html>
