<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TeamScore">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>TeamScore</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{display:grid;place-items:center}
#load{padding:24px;text-align:center;font-weight:800}
small{display:block;margin-top:8px;color:#94a3b8;font-weight:500}
</style>
</head>
<body>
<div id="load">TeamScore<small>טוען את האפליקציה…</small></div>
<script>
(async function(){
  const tnames=["t1.txt","t2.txt","t3.txt","t4.txt"];
  const bnames=["b1.txt","b2.txt","b3.txt","b4.txt"];
  const read=async n=>{const r=await fetch(n+"?v=28",{cache:"no-store"});if(!r.ok)throw new Error(n+" "+r.status);return r.text()};
  const parts=await Promise.all(tnames.map(read));
  const bgs=await Promise.all(bnames.map(read));
  const bin=atob(parts.join(""));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==="undefined")throw new Error("הדפדפן ישן מדי");
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  let html=await new Response(stream).text();
  bgs.forEach((b,i)=>{html=html.replaceAll("__BG"+(i+1)+"__","data:image/webp;base64,"+b.trim())});
  const sharp=bgs.map(b=>"data:image/webp;base64,"+b.trim());
  const sharpCss='<style id="sharpBgCss">.rotating-bg{display:none!important}#sharpBg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#11151d;pointer-events:none}#sharpBg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 28%;opacity:0;transition:opacity 1.2s ease;filter:saturate(1.03) contrast(1.03) brightness(.98)}#sharpBg img.active{opacity:1}.wrap{position:relative!important;z-index:2!important}</style>';
  const sharpHtml='<div id="sharpBg" aria-hidden="true"><img id="sharpA" class="active" src="'+sharp[0]+'" alt=""><img id="sharpB" src="'+sharp[1]+'" alt=""></div>';
  const sharpJs='<script>(function(){var imgs='+JSON.stringify(sharp)+',a=document.getElementById("sharpA"),b=document.getElementById("sharpB"),i=0,onA=true;if(!a||!b)return;imgs.forEach(function(s){var x=new Image();x.src=s});setInterval(function(){i=(i+1)%imgs.length;var n=onA?b:a,c=onA?a:b;n.src=imgs[i];n.classList.add("active");c.classList.remove("active");onA=!onA},15000)})();<\/script>';
  html=html.replace("</head>",sharpCss+"</head>").replace("<body>","<body>"+sharpHtml).replace("</body>",sharpJs+"</body>");
  html=html.replaceAll("icon-192.png","icon.svg").replaceAll("icon-512.png","icon.svg");
  document.open();document.write(html);document.close();
})().catch(e=>{
  document.getElementById("load").innerHTML="לא הצלחתי לטעון את TeamScore<small>"+String(e.message||e)+"</small>";
});
</script>
</body>
</html>
