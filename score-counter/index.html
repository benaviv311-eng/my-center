<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TeamScore">
<title>TeamScore</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{display:grid;place-items:center}
#load{padding:24px;text-align:center;font-weight:800}
small{display:block;margin-top:8px;color:#94a3b8;font-weight:500}
</style>
</head>
<body>
<div id="load">TeamScore<small>טוען את האפליקציה…</small></div>
<script>
(async function(){
  const tnames=["../team-score/t1.txt","../team-score/t2.txt","../team-score/t3.txt","../team-score/t4.txt"];
  const backgrounds=Array.from({length:18},(_,i)=>"assets/backgrounds/bg"+String(i+1).padStart(2,"0")+".webp?v=full18zoom130");
  const read=async n=>{const r=await fetch(n+"?hq=1",{cache:"no-store"});if(!r.ok)throw new Error(n+" "+r.status);return r.text()};
  const parts=await Promise.all(tnames.map(read));
  const bin=atob(parts.join(""));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==="undefined")throw new Error("הדפדפן ישן מדי");
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  let html=await new Response(stream).text();

  for(let i=0;i<4;i++){
    html=html.replaceAll("__BG"+(i+1)+"__",backgrounds[i]);
  }

  const sharpCss='<style id="sharpBgCss">.rotating-bg{display:none!important}#sharpBg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000;pointer-events:none}#sharpBg::before{content:"";position:absolute;left:25vw;top:0;width:50vw;height:100vh;background-image:var(--sharp-bg);background-size:cover;background-position:center center;background-repeat:no-repeat;filter:blur(18px);transform:scale(1.035);opacity:.82}#sharpBg img{position:absolute;left:25vw;top:0;width:50vw;height:100vh;max-width:none;object-fit:contain;object-position:center center;transform:scale(1.3);transform-origin:center center;opacity:0;transition:opacity 1.15s ease;image-rendering:auto}#sharpBg img.active{opacity:1}.wrap{position:relative!important;z-index:2!important}</style>';
  const sharpHtml='<div id="sharpBg" aria-hidden="true"><img id="sharpA" class="active" src="'+backgrounds[0]+'" alt="" decoding="async"><img id="sharpB" alt="" decoding="async"></div>';
  const sharpJs='<script>(function(){var imgs='+JSON.stringify(backgrounds)+',root=document.getElementById("sharpBg"),a=document.getElementById("sharpA"),b=document.getElementById("sharpB"),i=0,onA=true;if(!root||!a||!b)return;root.style.setProperty("--sharp-bg","url("+imgs[0]+")");function preload(n){var x=new Image();x.decoding="async";x.src=imgs[n%imgs.length]}preload(1);setInterval(function(){i=(i+1)%imgs.length;var n=onA?b:a,c=onA?a:b;var next=imgs[i];var show=function(){root.style.setProperty("--sharp-bg","url("+next+")");n.classList.add("active");c.classList.remove("active");preload(i+1)};if(n.src.endsWith(next)){show()}else{n.onload=show;n.src=next}onA=!onA},15000)})();<\/script>';
  const liveCss='<link rel="stylesheet" href="score-live.css?v=13">';
  const patchCss='<link rel="stylesheet" href="score-live-patch.css?v=10">';
  const containCss='<link rel="stylesheet" href="score-image-contain.css?v=1">';
  const layoutCss='<link rel="stylesheet" href="score-layout-menu.css?v=2">';
  const surfaceCss='<link rel="stylesheet" href="score-card-surface.css?v=2&rev=3">';
  const audioCss='<link rel="stylesheet" href="score-audio.css?v=4">';
  const gameSuiteCss='<link rel="stylesheet" href="score-game-suite.css?v=1">';
  const testLabCss='<link rel="stylesheet" href="score-test-lab.css?v=1">';
  const timeCenterCss='<link rel="stylesheet" href="score-time-center.css?v=1">';
  const pressureCss='<link rel="stylesheet" href="score-pressure-game.css?v=1">';
  const timedRoundsCss='<link rel="stylesheet" href="score-timed-rounds.css?v=1">';
  const fourTeamCss='<link rel="stylesheet" href="score-four-team-rotation.css?v=1">';
  const spiegelCss='<link rel="stylesheet" href="score-spiegel.css?v=1">';
  const coreGamesCss='<link rel="stylesheet" href="score-core-games.css?v=1">';
  const trainingGamesCss='<link rel="stylesheet" href="score-training-games.css?v=1">';
  const competitionGamesCss='<link rel="stylesheet" href="score-competition-games.css?v=1">';
  const flexibleGamesCss='<link rel="stylesheet" href="score-flexible-games.css?v=1">';
  const operationsCss='<link rel="stylesheet" href="score-operations.css?v=1">';
  const liveCoreJs='<script src="score-live-core.js?v=3"><\/script>';
  const liveJs='<script src="score-live.js?v=9"><\/script>';
  const patchJs='<script src="score-live-patch.js?v=8"><\/script>';
  const containJs='<script src="score-image-contain.js?v=1"><\/script>';
  const leaderJs='<script src="score-leader-top.js?v=9&rev=dynamic-heading-1"><\/script>';
  const layoutJs='<script src="score-layout-menu.js?v=1"><\/script>';
  const surfaceJs='<script src="score-card-surface.js?v=3"><\/script>';
  const stabilityJs='<script src="score-layout-stability.js?v=1"><\/script>';
  const lowerJs='<script src="score-layout-lower.js?v=5"><\/script>';
  const leaderOrderJs='<script src="score-leader-order.js?v=1"><\/script>';
  const audioJs='<script src="score-audio.js?v=5"><\/script>';
  const habaitaJs='<script src="score-habaita-refrain.js?v=1"><\/script>';
  const gameSuiteJs='<script src="score-game-suite.js?v=1"><\/script>';
  const testLabJs='<script src="score-test-lab.js?v=1"><\/script>';
  const timeCenterGuardJs='<script src="score-time-center-guard.js?v=1"><\/script>';
  const timeCenterJs='<script src="score-time-center.js?v=1"><\/script>';
  const pressureJs='<script src="score-pressure-game.js?v=1"><\/script>';
  const timedRoundsJs='<script src="score-timed-rounds.js?v=1"><\/script>';
  const fourTeamJs='<script src="score-four-team-rotation.js?v=1"><\/script>';
  const spiegelJs='<script src="score-spiegel.js?v=1"><\/script>';
  const coreGamesJs='<script src="score-core-games.js?v=1"><\/script>';
  const trainingGamesJs='<script src="score-training-games.js?v=1"><\/script>';
  const competitionGamesJs='<script src="score-competition-games.js?v=1"><\/script>';
  const flexibleGuardJs='<script src="score-flexible-setup-guard.js?v=1"><\/script>';
  const flexibleGamesJs='<script src="score-flexible-games.js?v=1"><\/script>';
  const remoteDisplayJs='<script src="score-remote-display.js?v=1"><\/script>';
  const cloudSyncJs='<script src="score-cloud-sync.js?v=1"><\/script>';
  const dataHubJs='<script src="score-data-hub.js?v=1"><\/script>';
  const humanVoiceJs='<script src="score-human-voice-pack.js?v=1"><\/script>';
  const testLabLiveStatusJs='<script src="score-test-lab-live-status.js?v=2"><\/script>';

  html=html.replace("</head>",sharpCss+liveCss+patchCss+containCss+layoutCss+surfaceCss+audioCss+gameSuiteCss+testLabCss+timeCenterCss+pressureCss+timedRoundsCss+fourTeamCss+spiegelCss+coreGamesCss+trainingGamesCss+competitionGamesCss+flexibleGamesCss+operationsCss+"</head>").replace("<body>","<body>"+sharpHtml).replace("</body>",sharpJs+liveCoreJs+liveJs+patchJs+containJs+leaderJs+layoutJs+stabilityJs+surfaceJs+lowerJs+leaderOrderJs+audioJs+habaitaJs+gameSuiteJs+testLabJs+timeCenterGuardJs+timeCenterJs+pressureJs+timedRoundsJs+fourTeamJs+spiegelJs+coreGamesJs+trainingGamesJs+competitionGamesJs+flexibleGuardJs+flexibleGamesJs+remoteDisplayJs+cloudSyncJs+dataHubJs+humanVoiceJs+testLabLiveStatusJs+"</body>");
  html=html.replaceAll("icon-192.png","../team-score/icon.svg").replaceAll("icon-512.png","../team-score/icon.svg");
  document.open();document.write(html);document.close();
})().catch(e=>{
  document.getElementById("load").innerHTML="לא הצלחתי לטעון את TeamScore<small>"+String(e.message||e)+"</small>";
});
</script>
</body>
</html>
