<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b8e9ff">
  <title>DOUBLE — קלאסי מהיר</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,Arial,sans-serif;background:linear-gradient(180deg,#a8eaff,#c7d6ff 45%,#dcbcff 74%,#ffc3df);color:#514171}button{font:inherit;touch-action:manipulation}
    body{min-height:100vh;overflow-x:hidden}.app{max-width:920px;margin:auto;padding:14px;position:relative;z-index:1}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:32px;font-weight:1000;color:#fff;-webkit-text-stroke:1px rgba(101,73,172,.4);text-shadow:0 4px 0 rgba(100,74,175,.23)}.mode-name{font-size:13px;font-weight:900}.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{background:linear-gradient(180deg,#fff,#f5f2ff);border:3px solid #fff;border-radius:18px;padding:7px 11px;font-weight:1000;box-shadow:0 6px 0 rgba(105,75,168,.12)}.target-pill{background:linear-gradient(180deg,#effcff,#dff7ff)}.elapsed-pill{background:linear-gradient(180deg,#fffceb,#fff1ba)}.best-pill{background:linear-gradient(180deg,#fff5c7,#ffe48a)}.challenge,.hint{text-align:center;font-weight:900;margin:9px 0}.hint{opacity:.7;font-size:13px}.board{display:grid;grid-template-columns:1fr 1fr;gap:20px;place-items:center;margin:10px auto 72px;max-width:820px}.card{width:min(39vw,350px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 28%,#fff,#fff 50%,#f3f5ff 80%);border:9px solid #fff;box-shadow:0 15px 0 rgba(99,68,157,.11),0 25px 48px rgba(92,54,144,.18);position:relative;overflow:hidden}.sym{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;padding:6px;min-width:46px;min-height:46px;display:grid;place-items:center;cursor:pointer}.glyph{display:inline-block;filter:drop-shadow(0 3px 3px #0002)}.glyph.spinning{animation:spin linear infinite}.sym.good{animation:good .3s ease}.sym.bad{animation:bad .28s ease}@keyframes spin{to{transform:rotate(360deg)}}@keyframes good{50%{filter:drop-shadow(0 0 18px #55df78);transform:translate(-50%,-50%) scale(1.25)}}@keyframes bad{25%,75%{transform:translate(calc(-50% - 7px),-50%)}50%{transform:translate(calc(-50% + 7px),-50%);filter:drop-shadow(0 0 12px #ff5c82)}}.controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:9px;z-index:3}.action{border:3px solid #fff;border-radius:18px;padding:11px 16px;font-weight:1000;cursor:pointer}.primary{background:linear-gradient(180deg,#7df195,#55df78);color:#174c2b;box-shadow:0 6px 0 #24a94e}.secondary{background:linear-gradient(180deg,#fff,#f4f0ff);color:#5c4b80;box-shadow:0 6px 0 rgba(103,74,163,.12)}.toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:18;padding:8px 15px;border-radius:999px;background:#fff;color:#5c4b80;font-size:18px;font-weight:1000;box-shadow:0 8px 20px #614e8a33;pointer-events:none}.toast.bad{color:#a82f58}.start{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:18px;background:rgba(108,74,168,.24);backdrop-filter:blur(8px)}.panel{width:min(460px,92vw);padding:26px 22px;border-radius:30px;border:4px solid #fff;background:linear-gradient(180deg,#fff,#faf4ff);box-shadow:0 13px 0 rgba(106,73,166,.14),0 28px 60px rgba(86,53,141,.22);text-align:center;color:#58467f}.panel h1{font-size:42px;margin:0 0 8px}.panel p{font-weight:800;line-height:1.55}.modes{display:flex;justify-content:center;margin-top:16px}.encouragement{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);z-index:25;pointer-events:none;font-size:42px;font-weight:1000}.reaction-time-pill{white-space:nowrap}
    @media(max-width:700px){.top{justify-content:center;text-align:center}.stats{justify-content:center}.board{gap:0;width:100vw;margin-left:calc(50% - 50vw)}.card{width:54vw}.card:first-child{margin-right:-10vw}.card:last-child{margin-left:-10vw}.challenge{font-size:14px}.pill{font-size:12px;padding:6px 8px}.controls{bottom:10px}.logo{font-size:28px}}
    @media(prefers-reduced-motion:reduce){.glyph.spinning,.sym.good,.sym.bad{animation:none!important}}
  </style>
</head>
<body data-mode="classic">
  <div id="start" class="start"><div id="menuPanel" class="panel"><h1>DOUBLE</h1><p>20 התאמות בזמן המהיר ביותר</p></div></div>
  <main class="app">
    <div class="top"><div><div class="logo">DOUBLE</div><div id="modeName" class="mode-name">קלאסי מהיר</div></div><div id="stats" class="stats"></div></div>
    <div id="challengeText" class="challenge"></div>
    <div id="turn" class="turn"></div>
    <div class="hint">מצא את הסמל היחיד שמופיע בשני הקלפים</div>
    <div id="board" class="board"></div>
    <div class="controls"><button id="shuffleBtn" type="button" class="action secondary">🔀 ערבב</button><button id="menuBtn" type="button" class="action secondary">← חזור</button></div>
  </main>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="double/classic-mode-rules.js?v=1"></script>
  <script src="double/classic-speed-game.js?v=1"></script>
</body>
</html>
