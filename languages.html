<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>פיד שפות | המרכז שלי</title>
  <meta name="theme-color" content="#f7f3ea">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="language-pages.css?v=1">
  <link rel="stylesheet" href="languages-feed.css?v=3">
</head>
<body>
<div class="app language-feed-page">
  <div class="back"><a class="btn small" href="index.html">← חזרה לבית</a></div>

  <section class="hero feed-hero">
    <div>
      <h1>🌍 פיד השפות שלי</h1>
      <p>מילים, משפטים, בדיחות, סיפורים, שיחות, אתגרים ומשחקים — ארבע השפות מתערבבות בפיד אחד.</p>
    </div>
    <div class="language-progress-line">
      <strong id="languages-daily-progress">0/4 שפות הושלמו היום</strong>
      <span id="feed-mode-label">כל ארבע השפות מעורבבות</span>
    </div>
  </section>

  <section class="feed-toolbar" aria-label="סינון וכלי הפיד">
    <div class="feed-filters" role="group" aria-label="בחר שפה בפיד">
      <button id="feed-filter-all" class="feed-filter active" type="button" data-feed-filter="all" aria-pressed="true">✨ הכול</button>
      <button id="feed-filter-four" class="feed-filter" type="button" data-feed-filter="four" aria-pressed="false">🌐 4 שפות</button>
      <button id="feed-filter-ar" class="feed-filter" type="button" data-feed-filter="ar" aria-pressed="false">AR · ערבית</button>
      <button id="feed-filter-it" class="feed-filter" type="button" data-feed-filter="it" aria-pressed="false">IT · איטלקית</button>
      <button id="feed-filter-ru" class="feed-filter" type="button" data-feed-filter="ru" aria-pressed="false">RU · רוסית</button>
      <button id="feed-filter-es" class="feed-filter" type="button" data-feed-filter="es" aria-pressed="false">ES · ספרדית</button>
      <a id="feed-vocabulary-tab" class="feed-filter" href="language-vocabulary.html">📚 אוצר מילים</a>
    </div>
    <div class="feed-tools">
      <div class="feed-tools-group">
        <button id="feed-refresh" class="btn small" type="button">↻ רענן פיד</button>
        <a class="btn small" href="four-languages.html">🌐 מילה ב־4 שפות</a>
      </div>
      <div id="feed-context-links" class="feed-quick-links" aria-label="קיצורי דרך ללימוד"></div>
    </div>
  </section>

  <main id="language-feed" class="language-feed" aria-live="polite"></main>

  <div class="feed-load-wrap">
    <button id="feed-load-more" class="feed-load-more" type="button">↓ תן לי עוד</button>
    <div id="feed-status" class="feed-status" aria-live="polite"></div>
  </div>

  <nav class="bottom-nav"><div class="inner">
    <a class="nav-item" href="index.html"><span>🏠</span>בית</a>
    <a class="nav-item" href="raika.html"><span>⚡</span>ראיקה</a>
    <a class="nav-item" href="coach.html"><span>🏐</span>מאמן</a>
    <a class="nav-item active" href="languages.html"><span>🌍</span>שפות</a>
    <a class="nav-item" href="music.html"><span>🎵</span>מוזיקה</a>
    <a class="nav-item" href="library.html"><span>📚</span>ספרייה</a>
  </div></nav>
</div>
<div class="toast" id="toast"></div>
<script src="app.js?v=3"></script>
<script src="language-feed-model.js?v=2"></script>
<script src="language-four-feed-model.js?v=1"></script>
<script src="languages-feed.js?v=3"></script>
<script>
(function(){try{const s=JSON.parse(localStorage.getItem('my-center-languages-v1')||'{}');const d=new Date();const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const n=(s.completedByDate&&s.completedByDate[k]||[]).length;const e=document.getElementById('languages-daily-progress');if(e)e.textContent=n+'/4 שפות הושלמו היום';}catch(e){}})();
</script>
</body>
</html>
