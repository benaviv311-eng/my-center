<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>שפות | המרכז שלי</title>
  <meta name="theme-color" content="#f7f3ea">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="languages.css?v=1">
</head>
<body>
<div class="app">
  <div class="back"><a class="btn small" href="index.html">← חזרה לבית</a></div>

  <div class="page-title language-page-title">
    <div>
      <h1>🌍 שפות</h1>
      <div class="subtitle">ערבית · איטלקית · רוסית · ספרדית</div>
    </div>
    <div class="daily-language-progress">
      <strong id="language-progress-label">0/4 הושלמו היום</strong>
      <div class="language-progress-track" aria-hidden="true">
        <span id="language-progress-bar"></span>
      </div>
    </div>
  </div>

  <section class="section">
    <div class="section-head">
      <h2>השיעורים של היום</h2>
      <small>5 מילים + משפט + תרגיל בכל שפה</small>
    </div>
    <div id="language-picker" class="language-picker" aria-label="בחירת שפה"></div>
  </section>

  <section class="section" id="daily-language-section">
    <div id="daily-language-unit"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>🔁 חזרה מהירה</h2>
      <small>חומר שכבר פגשת</small>
    </div>
    <article class="card">
      <div class="review-toolbar">
        <select id="review-language" class="language-select" aria-label="שפה לחזרה">
          <option value="all">כל השפות</option>
          <option value="ar">ערבית</option>
          <option value="it">איטלקית</option>
          <option value="ru">רוסית</option>
          <option value="es">ספרדית</option>
        </select>
        <button id="new-review" class="btn small" type="button">רענן חזרה ↻</button>
      </div>
      <div id="review-list" class="review-list"></div>
    </article>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>📚 המאגר שלי</h2>
      <small>נשמר אוטומטית במכשיר הזה</small>
    </div>
    <article class="card">
      <div id="language-stats" class="language-stats"></div>
      <div class="archive-toolbar">
        <input id="archive-search" class="search" type="search" placeholder="חפש מילה או תרגום">
        <select id="archive-language" class="language-select" aria-label="סינון מאגר לפי שפה">
          <option value="all">כל השפות</option>
          <option value="ar">ערבית</option>
          <option value="it">איטלקית</option>
          <option value="ru">רוסית</option>
          <option value="es">ספרדית</option>
        </select>
      </div>
      <div id="archive-list" class="archive-list"></div>
    </article>
  </section>

  <nav class="bottom-nav"><div class="inner">
    <a class="nav-item" href="index.html"><span>🏠</span>בית</a>
    <a class="nav-item" href="raika.html"><span>⚡</span>ראיקה</a>
    <a class="nav-item" href="coach.html"><span>🏐</span>מאמן</a>
    <a class="nav-item active" href="languages.html"><span>🌍</span>שפות</a>
    <a class="nav-item" href="music.html"><span>🎵</span>מוזיקה</a>
    <a class="nav-item" href="library.html"><span>📚</span>ספרייה</a>
  </div></nav>
</div>

<div class="toast" id="toast"></div>
<script src="app.js?v=3"></script>
<script src="languages.js?v=1"></script>
</body>
</html>
