<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>המרכז שלי</title>
  <meta name="theme-color" content="#f7f3ea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="המרכז שלי">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="app-icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="home-feed.css?v=1">
</head>
<body>
<div class="app home-feed-app">
  <header>
    <div><h1>המרכז שלי</h1><div class="subtitle">ראיקה · אימון · כדורעף · מוזיקה · שפות · למידה</div></div>
    <div class="top-actions"><button class="icon-btn" id="install-app-btn" title="התקנת האפליקציה" type="button" hidden>⬇️</button><a class="icon-btn" title="הבנק שלי" href="content-hub.html">🏦</a><button class="icon-btn" title="מועדפים" type="button" data-home-filter-shortcut="saved">♥</button></div>
  </header>

  <section class="home-feed-hero">
    <p class="eyebrow">המרכז שלי</p>
    <h2>מה מעניין אותי היום?</h2>
    <p>ראיקה, כדורעף, אימון, שפות, מוזיקה, ספרים ופסוקים — בפיד אחד שממשיך איתי לאורך היום.</p>
  </section>

  <section id="home-feed-toolbar" class="home-feed-toolbar" aria-label="סינון הפיד">
    <button class="home-filter active" data-home-filter="for-you" aria-pressed="true" type="button">✨ בשבילי</button>
    <button class="home-filter" data-home-filter="all" aria-pressed="false" type="button">הכול</button>
    <button class="home-filter" data-home-filter="raika" aria-pressed="false" type="button">⚡ ראיקה</button>
    <button class="home-filter" data-home-filter="coach" aria-pressed="false" type="button">🧠 מאמן</button>
    <button class="home-filter" data-home-filter="volleyball" aria-pressed="false" type="button">🏐 כדורעף</button>
    <button class="home-filter" data-home-filter="languages" aria-pressed="false" type="button">🌍 שפות</button>
    <button class="home-filter" data-home-filter="music" aria-pressed="false" type="button">🎵 מוזיקה</button>
    <button class="home-filter" data-home-filter="library" aria-pressed="false" type="button">📚 ספרייה</button>
    <button class="home-filter" data-home-filter="verses" aria-pressed="false" type="button">📖 פסוקים</button>
    <button class="home-filter" data-home-filter="saved" aria-pressed="false" type="button">♥ שמורים</button>
  </section>

  <p id="home-feed-status" class="home-feed-status" aria-live="polite">טוען את הפיד…</p>
  <main id="home-feed-list" class="home-feed-list" aria-live="polite"></main>
  <div id="home-feed-sentinel" class="home-feed-sentinel" aria-label="טעינת תוכן נוסף"><span></span><span></span><span></span></div>

  <nav class="bottom-nav"><div class="inner">
    <a class="nav-item active" href="index.html"><span>🏠</span>בית</a>
    <a class="nav-item" href="raika.html"><span>⚡</span>ראיקה</a>
    <a class="nav-item" href="coach.html"><span>🧠</span>מאמן</a>
    <a class="nav-item" href="volleyball.html"><span>🏐</span>כדורעף</a>
    <a class="nav-item" href="languages.html"><span>🌍</span>שפות</a>
    <a class="nav-item" href="music.html"><span>🎵</span>מוזיקה</a>
    <a class="nav-item" href="library.html"><span>📚</span>ספרייה</a>
  </div></nav>
</div>
<div class="toast" id="toast"></div>
<script src="pwa-install.js?v=1"></script>
<script src="app.js?v=4"></script>
<script src="raika-data.js"></script>
<script src="coach-feed-data.js"></script>
<script src="volleyball-data.js"></script>
<script src="language-feed-model.js?v=2"></script>
<script src="language-four-feed-model.js?v=1"></script>
<script src="library-discovery.js"></script>
<script src="daily-verses.js?v=2"></script>
<script src="home-feed-favorites.js?v=1"></script>
<script src="home-feed-state.js?v=1"></script>
<script src="home-feed-sources.js?v=1"></script>
<script src="home-feed-ranking.js?v=1"></script>
<script src="home-feed.js?v=1"></script>
<script>
document.addEventListener('click',event=>{
  const shortcut=event.target.closest('[data-home-filter-shortcut]');
  if(!shortcut)return;
  document.querySelector(`[data-home-filter="${shortcut.dataset.homeFilterShortcut}"]`)?.click();
});
</script>
</body>
</html>
