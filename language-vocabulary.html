<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>אוצר מילים | שפות</title>
  <meta name="theme-color" content="#f7f3ea">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="language-pages.css?v=1">
  <link rel="stylesheet" href="language-vocabulary.css?v=5">
  <link rel="stylesheet" href="language-ambience.css?v=1">
</head>
<body>
<div class="app vocabulary-page">
  <div class="back"><a class="btn small" href="languages.html">← חזרה לפיד</a></div>

  <section class="hero vocabulary-hero">
    <div class="study-title-row">
      <span id="vocab-language-code" class="language-code">AR</span>
      <div>
        <h1 id="vocab-page-title">📚 אוצר מילים</h1>
        <div id="vocab-language-name" class="subtitle"></div>
      </div>
    </div>
    <p id="vocab-summary" class="vocab-summary">מאגר פתוח · טוען…</p>
    <div id="arabic-living-moment" class="arabic-living-moment" hidden aria-live="polite"></div>
    <div id="vocab-language-switch" class="sticky-language-switch" aria-label="בחירת שפה"></div>
  </section>

  <section class="section vocabulary-controls-card">
    <article class="card">
      <div class="vocabulary-controls">
        <input id="vocab-search" class="study-input" type="search" placeholder="חפש מילה, תרגום או נושא" aria-label="חיפוש באוצר המילים">
        <div id="vocab-arabic-register" class="vocab-arabic-register" aria-label="סוג הערבית" hidden>
          <span class="vocab-register-label">ערבית:</span>
          <div class="vocab-register-buttons" role="group" aria-label="בחירת ערבית מדוברת או ספרותית">
            <button type="button" class="vocab-register-btn active" data-arabic-register="spoken" aria-pressed="true">🗣️ محكي · מדוברת</button>
            <button type="button" class="vocab-register-btn" data-arabic-register="msa" aria-pressed="false">📖 فصحى · ספרותית</button>
          </div>
        </div>
      </div>
      <div id="vocab-topic-nav" class="vocab-topic-nav" aria-label="בחירת נושא"></div>
    </article>
  </section>

  <main id="vocab-sections" class="vocab-sections"></main>

  <nav class="bottom-nav"><div class="inner">
    <a class="nav-item" href="index.html"><span>🏠</span>בית</a>
    <a class="nav-item" href="raika.html"><span>⚡</span>ראיקה</a>
    <a class="nav-item" href="coach.html"><span>🏐</span>מאמן</a>
    <a class="nav-item active" href="languages.html"><span>🌍</span>שפות</a>
    <a class="nav-item" href="music.html"><span>🎵</span>מוזיקה</a>
    <a class="nav-item" href="library.html"><span>📚</span>ספרייה</a>
  </div></nav>
</div>
<div id="language-music-controls" class="language-music-controls" hidden aria-label="מוזיקת אווירה">
  <button id="language-music-toggle" class="language-music-toggle" type="button" aria-pressed="false">🎵 מוזיקה</button>
  <button id="language-music-next" class="language-music-next" type="button">⏭️ סט הבא</button>
  <div id="language-music-label" class="language-music-label" aria-live="polite"></div>
  <div id="language-music-credit" class="language-music-credit"></div>
</div>
<div class="toast" id="toast"></div>
<script src="language-vocabulary-data-verbs.js?v=1"></script>
<script src="language-vocabulary-data-adjectives.js?v=1"></script>
<script src="language-vocabulary-data-nouns.js?v=1"></script>
<script src="language-vocabulary-data-places-home.js?v=1"></script>
<script src="language-vocabulary-ar-spoken.js?v=1"></script>
<script src="language-vocabulary-bank.js?v=2"></script>
<script src="language-vocabulary-view-model.js?v=1"></script>
<script src="language-vocabulary.js?v=6"></script>
<script src="language-audio.js?v=3"></script>
<script src="language-ambience.js?v=1"></script>
