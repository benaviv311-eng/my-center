<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15152a">
  <title>DOUBLE</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Arial,sans-serif;background:radial-gradient(circle at top,#35356c,#111126 70%);color:#fff;min-height:100vh}
    button{font:inherit;touch-action:manipulation;pointer-events:auto;-webkit-tap-highlight-color:transparent}
    .app{max-width:760px;margin:auto;padding:12px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
    .logo{font-size:27px;font-weight:1000}
    .mode-name{font-size:13px;opacity:.72;font-weight:800}
    .stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .pill{background:#ffffff18;border:1px solid #ffffff25;border-radius:18px;padding:7px 10px;font-weight:900}
    .p1{outline:2px solid #55c8ff}.p2{outline:2px solid #ff6b91}
    .challenge{text-align:center;font-weight:800;margin:8px 0 3px}
    .hint{text-align:center;opacity:.75;margin:3px 0 8px}
    .board{display:grid;gap:12px;justify-items:center}
    .card{width:min(84vw,345px);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 10px 35px #0008,inset 0 0 0 8px #eee;position:relative;overflow:hidden}
    .sym{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:7px;line-height:1;cursor:pointer;display:grid;place-items:center;min-width:48px;min-height:48px}
    .sym:active{scale:.92}
    .glyph{display:inline-block;will-change:transform}
    .glyph.spinning{animation:spin linear infinite}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.glyph.spinning{animation:none!important}}
    .controls,.modes{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}
    button.action{border:0;border-radius:16px;padding:11px 16px;font-weight:900;font-size:16px;cursor:pointer}
    .primary{background:#ffd84d;color:#171717}.secondary{background:#fff;color:#171717}.blue{background:#55c8ff}.pink{background:#ff6b91}
    .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);font-size:25px;font-weight:1000;pointer-events:none;z-index:6;text-align:center}
    .start{position:fixed;inset:0;background:linear-gradient(#22224f,#0e0e22);display:grid;place-items:center;z-index:4;padding:18px;overflow:auto}
    .panel{text-align:center;padding:24px;max-width:620px;width:min(100%,620px)}
    .panel h1{font-size:52px;margin:0 0 6px}
    .panel p{opacity:.82}
    .big{font-size:18px!important;padding:14px 20px!important}
    .turn{text-align:center;font-size:20px;font-weight:1000;margin:6px}
    .mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
    .mode-card{border:0;border-radius:18px;padding:16px 13px;min-height:88px;text-align:right;cursor:pointer;color:#171717;display:grid;gap:5px;align-content:center}
    .mode-card b{font-size:19px}.mode-card small{font-size:13px;line-height:1.3;opacity:.75;font-weight:700}
    .mode-card.classic{background:#ffd84d}.mode-card.levels{background:#b8a6ff}.mode-card.knockout{background:#ff9b76}.mode-card.survival{background:#7ee0b8}.mode-card.versus{background:#55c8ff;grid-column:1/-1}
    .menu-note{font-size:13px}
    .difficulty-wrap{margin:16px 0 4px;display:grid;gap:8px}
    .difficulty-wrap>span{font-size:14px;font-weight:900;opacity:.82}
    .difficulty-picker{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
    .difficulty-picker button{border:1px solid #ffffff30;background:#ffffff12;color:#fff;border-radius:14px;padding:9px 16px;font-weight:900;cursor:pointer}
    .difficulty-picker button.active{background:#ffd84d;color:#171717;border-color:#ffd84d}
    .best-strip{margin:10px auto 4px;padding:9px 12px;border-radius:14px;background:#ffffff12;border:1px solid #ffffff20;font-size:13px;font-weight:800;max-width:520px}
    .boss-card{box-shadow:0 0 0 5px #ffd84d,0 10px 35px #0008,inset 0 0 0 8px #eee}
    .boss-pill{background:#ffd84d;color:#171717;border-color:#ffd84d}

    .profile-line{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:8px 0 14px;font-size:13px;opacity:.9}
    .progress-card{background:#ffffff10;border:1px solid #ffffff20;border-radius:18px;padding:14px;margin:10px 0 14px;text-align:right}
    .progress-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}
    .progress-bar{height:9px;border-radius:999px;background:#ffffff18;overflow:hidden}
    .progress-bar i{display:block;height:100%;background:#ffd84d;border-radius:999px}
    .stage-map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:13px 0}
    .stage-node{min-height:46px;border:1px solid #ffffff28;background:#ffffff10;color:#fff;border-radius:14px;font-weight:1000;display:grid;place-items:center;gap:1px;cursor:pointer}
    .stage-node span{font-size:13px}
    .stage-node.done{background:#7ee0b8;color:#111;border-color:#7ee0b8}
    .stage-node.current{background:#ffd84d;color:#111;border-color:#ffd84d;outline:3px solid #ffffff25}
    .stage-node.boss{border-radius:50%}
    .stage-node:disabled{opacity:.28;cursor:not-allowed}
    .score-rules{display:grid;gap:5px;text-align:right;margin:12px 0;padding:12px 14px;border-radius:16px;background:#ffffff0d;border:1px solid #ffffff18}
    .score-rules span,.score-rules small{font-size:13px;line-height:1.45;opacity:.85}
    .combo-pill{background:#ffdf70;color:#171717;border-color:#ffdf70}
    .compact-rules{margin-top:14px}
    .submenu-head{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;margin-bottom:12px}
    .submenu-head h2{margin:0;font-size:28px}
    .submenu-head small{opacity:.72}
  
    .encouragement{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%) scale(.7);z-index:20;pointer-events:none;font-weight:1000;letter-spacing:.04em;text-shadow:0 4px 18px #0009;opacity:0;animation:encourage .72s ease-out}
    .encouragement.level-1{font-size:clamp(30px,8vw,56px)}
    .encouragement.level-2{font-size:clamp(36px,10vw,68px)}
    .encouragement.level-3{font-size:clamp(44px,12vw,82px)}
    .encouragement.level-4{font-size:clamp(52px,14vw,96px)}
    @keyframes encourage{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}72%{opacity:1;transform:translate(-50%,-58%) scale(1)}100%{opacity:0;transform:translate(-50%,-72%) scale(.9)}}
    .coin-pop{position:fixed;z-index:22;pointer-events:none;font-size:30px;transform:translate(-50%,-50%);animation:coinBurst .95s cubic-bezier(.2,.8,.2,1) forwards}
    .coin-amount{position:fixed;z-index:23;pointer-events:none;font-size:24px;font-weight:1000;transform:translate(-50%,-50%);text-shadow:0 3px 12px #000b;animation:coinAmount .9s ease-out forwards}
    @keyframes coinBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}70%{opacity:1;transform:translate(calc(-50% + var(--coin-x)),calc(-50% + var(--coin-y))) scale(1.18) rotate(240deg)}100%{opacity:0;transform:translate(calc(-50% + var(--coin-x)),calc(-50% + var(--coin-y) - 24px)) scale(.75) rotate(360deg)}}
    @keyframes coinAmount{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}25%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-150%) scale(.95)}}
    @media (prefers-reduced-motion:reduce){.encouragement,.coin-pop,.coin-amount{animation-duration:.01ms!important}}
  
    .wallet-line{display:inline-flex;align-items:center;gap:6px;background:#ffffff12;border:1px solid #ffffff20;border-radius:999px;padding:8px 13px;margin:4px auto 12px;font-size:14px}
    .world-card{background:linear-gradient(180deg,#ffffff12,#ffffff08);border:1px solid #ffffff20;border-radius:24px;padding:16px;margin:10px 0 14px;text-align:right}
    .world-map{position:relative;margin-top:16px;padding:14px 6px 10px;border-radius:22px;background:linear-gradient(180deg,#20345f66,#16254255);overflow:hidden}
    .world-map:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,#ffffff12,transparent 26%),radial-gradient(circle at 80% 42%,#ffffff0c,transparent 22%),radial-gradient(circle at 40% 80%,#ffffff0a,transparent 20%);pointer-events:none}
    .world-zone-label,.world-finish{position:relative;z-index:1;text-align:center;font-weight:1000;font-size:13px;opacity:.85;margin:2px 0 10px}
    .world-finish{margin-top:12px}
    .world-row{position:relative;z-index:1;display:flex;justify-content:flex-start;gap:12px;margin:10px 0;padding:0 8px}
    .world-row.reverse{justify-content:flex-end}
    .world-row:after{content:"";position:absolute;left:12%;right:12%;top:50%;height:3px;background:#ffffff18;border-radius:999px;z-index:-1}
    .stage-node{width:64px;min-height:64px;border-radius:50%;border:3px solid #ffffff2e;background:#283a62;color:#fff;display:grid;place-items:center;align-content:center;gap:0;cursor:pointer;box-shadow:0 5px 0 #0004}
    .stage-node strong{font-size:18px;line-height:1}
    .stage-node small{font-size:9px;opacity:.74;margin-top:3px}
    .stage-node .stage-icon{font-size:16px;line-height:1;margin-bottom:2px}
    .stage-node.done{background:#63c995;color:#102116;border-color:#b6f2cf}
    .stage-node.current{background:#ffd84d;color:#171717;border-color:#fff3a0;transform:scale(1.08);box-shadow:0 0 0 5px #ffd84d30,0 6px 0 #0004}
    .stage-node.boss{background:#8558c9;border-color:#d6c3ff}
    .stage-node.boss.done{background:#8fd3a7}
    .stage-node.boss.current{background:#ffd84d}
    .stage-node:disabled{opacity:.28;filter:grayscale(.7);cursor:not-allowed;box-shadow:none}
    .world-rules{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:13px}
    .world-rules span{font-size:11px;background:#ffffff0d;border:1px solid #ffffff18;border-radius:999px;padding:6px 9px}
    @media(max-width:520px){
      .world-row{gap:7px;padding:0 2px}
      .stage-node{width:56px;min-height:56px}
      .stage-node strong{font-size:16px}
    }
  
    .encouragement{position:fixed;left:50%;top:27%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;font-weight:1000;letter-spacing:.05em;opacity:0;text-align:center;white-space:nowrap;animation:encouragePop .85s cubic-bezier(.18,.9,.2,1)}
    .encouragement span{display:inline-block;background:linear-gradient(90deg,#fff7a8,#fff,#ffd95c,#fff,#ffec83);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #fff8;filter:drop-shadow(0 0 8px #ffe56b) drop-shadow(0 5px 14px #000b);animation:shineText .55s linear infinite}
    .encouragement.level-1{font-size:clamp(32px,8vw,56px)}
    .encouragement.level-2{font-size:clamp(40px,10vw,70px)}
    .encouragement.level-3{font-size:clamp(48px,12vw,84px)}
    .encouragement.level-4{font-size:clamp(56px,14vw,98px)}
    .encouragement.level-5{font-size:clamp(62px,16vw,112px)}
    @keyframes encouragePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-4deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.22) rotate(2deg)}48%{opacity:1;transform:translate(-50%,-54%) scale(.98)}78%{opacity:1;transform:translate(-50%,-59%) scale(1.04)}100%{opacity:0;transform:translate(-50%,-72%) scale(.88)}}
    @keyframes shineText{0%{background-position:0 0}100%{background-position:260% 0}}
    .success-spark{position:fixed;z-index:29;pointer-events:none;font-size:24px;transform:translate(-50%,-50%);animation:sparkFly .82s ease-out forwards;text-shadow:0 0 10px currentColor}
    .spark-1{color:#fff4a3}.spark-2{color:#fff}.spark-3{color:#ffd84d}
    @keyframes sparkFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(0)}18%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(1.35) rotate(220deg)}}
    .side-coin{position:fixed;z-index:28;pointer-events:none;font-size:30px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 6px #ffd84d);animation:sideCoinBurst 1.12s cubic-bezier(.12,.8,.2,1) forwards}
    @keyframes sideCoinBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(0)}12%{opacity:1}65%{opacity:1;transform:translate(calc(-50% + var(--coin-x)),calc(-50% + var(--coin-y))) scale(1.25) rotate(var(--coin-r))}100%{opacity:0;transform:translate(calc(-50% + var(--coin-x)),calc(-50% + var(--coin-y) - 30px)) scale(.7) rotate(var(--coin-r))}}
    .side-total{font-size:30px!important;font-weight:1000;text-shadow:0 0 12px #ffd84d,0 4px 12px #000b;animation:coinAmount 1.05s ease-out forwards!important}
    @media (prefers-reduced-motion:reduce){.encouragement,.encouragement span,.success-spark,.side-coin,.side-total{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  
    .mode-card.sprint{background:#ffcf6b}
    .sprint-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
    .sprint-card{border:0;border-radius:18px;padding:18px 12px;background:linear-gradient(180deg,#ffd86a,#ffb83e);color:#171717;display:grid;gap:6px;cursor:pointer;min-height:96px;box-shadow:0 6px 0 #0003}
    .sprint-card b{font-size:20px}
    .sprint-card span{font-size:12px;font-weight:800;opacity:.78}
    .sprint-card:active{transform:translateY(2px);box-shadow:0 3px 0 #0003}
    @media(max-width:520px){.sprint-grid{grid-template-columns:1fr}.sprint-card{min-height:78px}}
  
    .assist-btn{background:linear-gradient(180deg,#ffe48a,#ffc94d);color:#171717;border:1px solid #fff2b2!important;box-shadow:0 4px 0 #0003}
    .assist-btn:disabled{opacity:.5;filter:grayscale(.45);box-shadow:none;cursor:not-allowed}
  
    .mode-card.versus{background:linear-gradient(135deg,#55c8ff,#ff6b91)!important}
    .versus-setup{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
    .key-player{border-radius:20px;padding:14px;background:#ffffff0d;border:1px solid #ffffff1f}
    .key-player h3{margin:0 0 10px}
    .p1-setup{box-shadow:inset 0 0 0 2px #55c8ff44}
    .p2-setup{box-shadow:inset 0 0 0 2px #ff6b9144}
    .key-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .key-bind{border:1px solid #ffffff26;background:#ffffff12;color:#fff;border-radius:14px;padding:10px;display:grid;gap:4px;cursor:pointer;min-height:58px}
    .key-bind span{font-size:11px;opacity:.72}.key-bind b{font-size:16px}
    .key-bind.listening{background:#ffd84d;color:#171717;border-color:#fff3a0}
    .versus-live-help{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
    .versus-live-help span{border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900}
    .p1-help{background:#55c8ff33;border:1px solid #55c8ff88}
    .p2-help{background:#ff6b9133;border:1px solid #ff6b9188}
    .versus-board{direction:ltr}
    .versus-card.player-1{box-shadow:0 0 0 4px #55c8ff,0 10px 35px #0008,inset 0 0 0 8px #eee;grid-column:2}
    .versus-card.player-2{box-shadow:0 0 0 4px #ff6b91,0 10px 35px #0008,inset 0 0 0 8px #eee;grid-column:1}
    .versus-card{direction:rtl}
    .versus-setup{direction:ltr}
    .p1-setup{grid-column:2;direction:rtl}
    .p2-setup{grid-column:1;direction:rtl}
    .sym.cursor-p1:after,.sym.cursor-p2:after{position:absolute;content:"➤";font-size:22px;top:-16px;left:50%;transform:translateX(-50%) rotate(90deg);filter:drop-shadow(0 2px 3px #0008);pointer-events:none}
    .sym.cursor-p1:after{color:#169fe8}.sym.cursor-p2:after{color:#ff3f75}
    .sym.cursor-p1{outline:3px solid #55c8ff;border-radius:50%;background:#55c8ff1f}
    .sym.cursor-p2{outline:3px solid #ff6b91;border-radius:50%;background:#ff6b911f}
    .sym.versus-winner{animation:versusWin .6s ease-out}
    .sym.versus-wrong{animation:versusWrong .28s linear}
    @keyframes versusWin{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.45)}100%{transform:translate(-50%,-50%) scale(1)}}
    @keyframes versusWrong{0%,100%{translate:0 0}25%{translate:-5px 0}75%{translate:5px 0}}
    @media(max-width:520px){.versus-setup{grid-template-columns:1fr}.p1-setup,.p2-setup{grid-column:1}.p1-setup{order:1}.p2-setup{order:2}.key-grid{grid-template-columns:repeat(2,1fr)}.versus-card.player-1,.versus-card.player-2{grid-column:1}}
      @media(min-width:760px){.board{grid-template-columns:1fr 1fr}.card{width:340px}}
    @media(max-width:520px){.mode-grid{grid-template-columns:1fr}.mode-card.versus{grid-column:auto}.panel h1{font-size:44px}.stats{justify-content:center}.top{justify-content:center;text-align:center}}
  </style>
</head>
<body>
  <div id="start" class="start">
    <div id="menuPanel" class="panel">
      <h1>DOUBLE</h1>
      <p>מצא את הסמל המשותף בין שני הקלפים</p>

      <div class="difficulty-wrap">
        <span>רמת קושי</span>
        <div class="difficulty-picker">
          <button type="button" data-difficulty="easy">קל</button>
          <button type="button" data-difficulty="normal">בינוני</button>
          <button type="button" data-difficulty="hard">קשה</button>
        </div>
      </div>

      <div class="best-strip" id="bestStrip">השיאים שלך יופיעו כאן</div>

      <div class="mode-grid">
        <button type="button" class="mode-card classic" data-mode="classic"><b>⚡ קלאסי</b><small>ניקוד ורצף · הזמן משתנה לפי הרמה</small></button>
        <button type="button" class="mode-card levels" data-mode="levels"><b>🚀 שלבים</b><small>כל שלב קשה יותר · כל שלב 5 הוא בוס 👑</small></button>
        <button type="button" class="mode-card knockout" data-mode="knockout"><b>🎯 נוקאאוט</b><small>יעד התאמות בתוך זמן מוגבל</small></button>
        <button type="button" class="mode-card survival" data-mode="survival"><b>🛡️ הישרדות</b><small>כל הצלחה מוסיפה זמן</small></button>
        <button type="button" class="mode-card versus" data-mode="versus"><b>👥 שני שחקנים</b><small>ראש בראש על אותו מסך</small></button>
      </div>
      <p class="menu-note">השיאים נשמרים במכשיר בנפרד לכל רמת קושי.</p>
    </div>
  </div>

  <div class="app">
    <div class="top">
      <div>
        <div class="logo">DOUBLE</div>
        <div id="modeName" class="mode-name"></div>
      </div>
      <div id="stats" class="stats"></div>
    </div>
    <div id="challengeText" class="challenge"></div>
    <div id="turn" class="turn"></div>
    <div class="hint">לחץ על הסמל הזהה</div>
    <div id="board" class="board"></div>
    <div id="playerButtons" class="controls"></div>
    <div class="controls">
      <button type="button" id="shuffleBtn" class="action secondary">ערבב</button>
      <button type="button" id="menuBtn" class="action secondary">← חזור</button>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="game.js?v=17"></script>
</body>
</html>
