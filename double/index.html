<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15152a"><title>DOUBLE</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:radial-gradient(circle at top,#35356c,#111126 70%);color:white;min-height:100vh}.app{max-width:720px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:1000;letter-spacing:2px}.stats{display:flex;gap:8px}.pill{background:#ffffff18;border:1px solid #ffffff25;border-radius:18px;padding:7px 11px;font-weight:800}.hint{text-align:center;opacity:.8;margin:5px}.board{display:grid;gap:14px;justify-items:center}.card{width:min(86vw,350px);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 10px 35px #0008,inset 0 0 0 8px #eee;position:relative;overflow:hidden}.sym{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:4px;line-height:1;cursor:pointer;filter:drop-shadow(0 2px 1px #0002);transition:.1s}.sym:active{scale:.9}.controls{display:flex;justify-content:center;gap:8px;margin-top:12px}button.action{border:0;border-radius:16px;padding:11px 16px;font-weight:900;font-size:16px}.primary{background:#ffd84d}.secondary{background:#fff}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);font-size:25px;font-weight:1000;pointer-events:none}.start{position:fixed;inset:0;background:linear-gradient(#22224f,#0e0e22);display:grid;place-items:center;z-index:4}.panel{text-align:center;padding:30px}.panel h1{font-size:52px;margin:0}.panel p{opacity:.8}.big{font-size:22px;padding:15px 30px!important}@media(min-width:760px){.board{grid-template-columns:1fr 1fr}.card{width:330px}}</style></head><body><div id="start" class="start"><div class="panel"><h1>DOUBLE</h1><p>מצא את הסמל המשותף בין שני הקלפים</p><button class="action primary big" onclick="startGame()">שחק עכשיו</button></div></div><div class="app"><div class="top"><div class="logo">DOUBLE</div><div class="stats"><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱️ <span id="time">60</span></div></div></div><div class="hint">לחץ על הסמל הזהה</div><div id="board" class="board"></div><div class="controls"><button class="action secondary" onclick="newRound()">ערבב</button><button class="action secondary" onclick="startGame()">התחל מחדש</button></div></div><div id="toast" class="toast"></div><script>
const icons=['🐶','🐱','🦁','🐘','🐵','🐼','🐧','🐟','🍕','🍎','🍌','🍉','🍦','🍩','🍔','🍓','⚽','🏀','🏐','🎾','🏆','🎯','🛹','🚗','✈️','🚲','🚀','🚂','🚢','☀️','🌙','⭐','🌈','☁️','⚡','🔥','🌸','❤️','👑','💎','😊','👻','💩','🎸','🎁','🔑','⏰','💡','📷','🎈','🤖','🦄','👽','🐉','🧙','🏰','🏴‍☠️'];
let deck=[],pair=[],score=0,streak=0,time=60,timer=null,active=false;
function buildDeck(){let lines=[];for(let m=0;m<7;m++)for(let b=0;b<7;b++){let a=[];for(let x=0;x<7;x++)a.push(x*7+((m*x+b)%7));a.push(49+m);lines.push(a)}for(let b=0;b<7;b++){let a=[];for(let y=0;y<7;y++)a.push(b*7+y);a.push(56);lines.push(a)}lines.push([49,50,51,52,53,54,55,56]);return lines}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(){document.getElementById('start').style.display='none';score=0;streak=0;time=60;active=true;deck=shuffle(buildDeck());update();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)end()},1000);newRound()}
function newRound(){if(!active)return;let a=deck[Math.floor(Math.random()*deck.length)],b;do b=deck[Math.floor(Math.random()*deck.length)];while(b===a);pair=[a,b];render()}
const spots=[[50,16],[27,30],[70,31],[48,43],[22,58],[76,60],[39,76],[62,80]];
function render(){let board=document.getElementById('board');board.innerHTML='';pair.forEach(card=>{let el=document.createElement('div');el.className='card';shuffle(card).forEach((id,i)=>{let p=spots[i],bt=document.createElement('button');bt.className='sym';bt.textContent=icons[id];bt.style.left=p[0]+'%';bt.style.top=p[1]+'%';bt.style.fontSize=(36+Math.random()*18)+'px';bt.style.transform='translate(-50%,-50%) rotate('+(-25+Math.random()*50)+'deg)';bt.onclick=()=>hit(id);el.appendChild(bt)});board.appendChild(el)})}
function hit(id){let common=pair[0].find(x=>pair[1].includes(x));if(id===common){score+=10+streak*2;streak++;flash('✓ מצאת!');newRound()}else{score=Math.max(0,score-3);streak=0;flash('✕ נסה שוב')}update()}
function flash(t){let e=document.getElementById('toast');e.textContent=t;clearTimeout(e._t);e._t=setTimeout(()=>e.textContent='',500)}
function update(){scoreEl=document.getElementById('score');scoreEl.textContent=score;document.getElementById('streak').textContent=streak;document.getElementById('time').textContent=time}
function end(){active=false;clearInterval(timer);document.getElementById('start').style.display='grid';document.querySelector('.panel').innerHTML='<h1>'+score+'</h1><p>הניקוד שלך</p><button class="action primary big" onclick="location.reload()">משחק חדש</button>'}
deck=buildDeck();
</script></body></html>
