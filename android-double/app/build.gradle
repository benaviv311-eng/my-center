plugins {
    id "com.android.application"
}

android {
    namespace "com.benaviv.doublegame"
    compileSdk 36

    defaultConfig {
        applicationId "com.benaviv.doublegame"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
