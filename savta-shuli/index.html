<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>סבתא שולי – האלבום המשפחתי</title>
<style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff7ed;color:#57393b;min-height:90vh;display:grid;place-items:center;text-align:center;padding:30px}main{max-width:460px}h1{font-size:clamp(2rem,7vw,3rem)}p{line-height:1.7}.spin{border:4px solid #e5ccd1;border-top-color:#c5698f;border-radius:50%;width:35px;height:35px;animation:s 1s linear infinite;margin:24px auto}@keyframes s{to{transform:rotate(360deg)}}</style>
</head><body><main><h1>האלבום של סבתא שולי ❤️</h1><div class="spin"></div><p id="msg">טוענים את הזיכרונות והתמונות...</p></main>
<script>(async()=>{try{
const parts=await Promise.all(Array.from({length:19},async(_,i)=>{const n=String(i).padStart(2,'0');const r=await fetch('v2/parts/'+n+'.txt',{cache:'no-cache'});if(!r.ok)throw new Error('Missing album part '+n);return r.text()}));
let html=parts.join('').replace('<head>','<head><meta name="robots" content="noindex,nofollow">');

const benCard='<article class="person" id="ben-kneidlach-card"><div class="person-head"><div style="background:linear-gradient(135deg,#f5d9be,#f8eee4);border-radius:16px;display:grid;place-items:center;min-height:190px"><img data-ben-panel="0" alt="בן וסבתא שולי מכינים קניידלך" style="width:100%;max-height:240px;object-fit:contain;border-radius:12px"></div><div><small>הסיפור של בן</small><h3>בן · העולם הוא שלך!</h3><p>ארבעה פאנלים על קניידלך, דמיון והאהבה של סבתא שולי.</p><a href="ben-kneidlach.html#story" style="display:inline-block;text-decoration:none;color:white;background:#986a76;border-radius:28px;padding:10px 20px;font-weight:bold">לפתיחת ארבעת הפאנלים</a></div></div></article>';
const benQuote='<article id="ben-kneidlach-quote" style="max-width:740px;background:#fffbf4;border:1px solid #eadbd1;border-radius:20px;padding:22px;margin:24px auto;text-align:center"><small style="color:#986a76">משפטי המחץ של סבתא שולי</small><h3 style="font-size:32px;margin:7px 0 16px">״העולם הוא שלך!״</h3><a href="ben-kneidlach.html#quote" style="display:block"><img data-ben-panel="3" alt="בן וסבתא שולי וקניידלך בכל מיני צורות" style="width:100%;border-radius:13px"></a><p>לחצו על התמונה לצפייה בסיפור המלא</p></article>';
html=html.replace('<section id="people">','<section id="people">'+benCard);
html=html.replace('<section id="quotes"','<section id="quotes"'); // keep existing section attributes
html=html.replace(/(<section\s+id="quotes"[^>]*>)/, '$1'+benQuote);
const benAssets='<script>(async function(){try{const r=await fetch("ben-kneidlach.html",{cache:"force-cache"});if(!r.ok)return;const doc=new DOMParser().parseFromString(await r.text(),"text/html");const imgs=doc.querySelectorAll(".panels .panel img");[0,3].forEach(i=>{const src=imgs[i]?.getAttribute("src");if(src)document.querySelectorAll("[data-ben-panel=\""+i+"\"]").forEach(el=>el.src=src)})}catch(e){console.warn("Ben story preview unavailable",e)}})();<\/script>';
html=html.replace('</body>',benAssets+'</body>');

if(!html.includes('מלין חן')||!html.includes('צמה לכל יום')||!html.includes('סבתא שולי'))throw new Error('Incomplete album');
document.open();document.write(html);document.close();
}catch(e){document.getElementById('msg').textContent='האתר לא נטען כרגע. נסו לרענן את הדף.';console.error(e)}})();</script>
</body></html>
