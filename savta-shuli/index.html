<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>סבתא שולי – האלבום המשפחתי</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff7ed;color:#57393b;min-height:90vh;display:grid;place-items:center;text-align:center;padding:30px}main{max-width:460px}h1{font-size:clamp(2rem,7vw,3rem)}p{line-height:1.7}.spin{border:4px solid #e5ccd1;border-top-color:#c5698f;border-radius:50%;width:35px;height:35px;animation:s 1s linear infinite;margin:24px auto}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main><h1>האלבום של סבתא שולי ❤️</h1><div class="spin"></div><p id="msg">מכינים את הזיכרונות והתמונות...</p></main><script>(async()=>{try{let parts=await Promise.all(Array.from({length:25},async(_,i)=>{let r=await fetch('parts/'+String(i).padStart(2,'0')+'.txt');if(!r.ok)throw new Error('תמונה או חלק מהאלבום לא נטען');return r.text()}));let html=parts.join('').replace('<head>','<head><meta name="robots" content="noindex,nofollow">');document.open();document.write(html);document.close()}catch(e){document.getElementById('msg').textContent='לא ניתן לפתוח את האלבום כרגע. נסו לרענן את הדף.';console.error(e)}})();</script></body></html>
