<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אישור שירי אבא</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:980px;margin:auto;padding:22px}h1{margin:0 0 6px}.sub{color:#5c6677;margin-bottom:16px}.toolbar{position:sticky;top:0;z-index:5;background:#f5f7fbe8;backdrop-filter:blur(8px);padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.song{background:#fff;border:1px solid #dce3ee;border-radius:16px;padding:14px;margin:10px 0;display:grid;grid-template-columns:48px 1fr;gap:12px;box-shadow:0 2px 8px #0000000a}.num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#172033;color:#fff;font-weight:800;font-size:18px}.title{font-size:18px;font-weight:700;margin:2px 0 10px}.actions,.choices{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.play{background:#172033;color:#fff}.stop{background:#e9edf4;color:#172033}.choice{background:#fafbfd;border:1px solid #d7deea}.choice.active.ok{background:#dff6e7;border-color:#27ae60}.choice.active.bad{background:#ffe2e2;border-color:#d64545}.choice.active.redo{background:#fff0cc;border-color:#e5a11b}.song[data-status=ok]{border:2px solid #27ae60}.song[data-status=bad]{border:2px solid #d64545}.song[data-status=redo]{border:2px solid #e5a11b}.playing{display:none;margin-right:8px;font-weight:700;color:#2375d8}.song.is-playing .playing{display:inline}.count{font-weight:700;color:#596579}.summary{width:100%;min-height:150px;margin-top:16px;border:1px solid #d7deea;border-radius:12px;padding:12px;font:16px Arial;box-sizing:border-box}</style></head><body><div class="wrap"><h1>אישור 24 שירי אבא</h1><div class="sub">לחץ ▶ נגן בתוך העמוד, ואז סמן לכל שיר ✅ מאושר / ❌ קול לא נכון / 🔁 ליצור מחדש. הסימונים נשמרים במכשיר.</div><div class="toolbar"><button class="play" id="summaryBtn">צור סיכום</button><button class="stop" id="copyBtn">העתק סיכום</button><button class="stop" id="clearBtn">נקה סימונים</button><span class="count" id="count"></span></div><div id="list"></div><textarea class="summary" id="summary" placeholder="כאן יופיע הסיכום..."></textarea></div><script>const base='https://iwemlxvjyhffumzcqrxf.supabase.co/storage/v1/object/public/crazy-family-audio/';const songs=[[1,'אבטיח הלך לשיח / מלון הלך לישון'],[2,'בננה נסעה לרעננה / וחזרה עם מתנה'],[3,'מלפפון טס בבלון / ונחת ישר בסלון'],[4,'לימון קפץ לחלון / והתחבא בתוך ארון'],[5,'אגס טיפס על פנס / וצעק: אני נכנס!'],[6,'תפוח עף עם הרוח / ונחת על כרוב נפוח'],[7,'אננס נכנס לכנס / וצעק: מי עוד נכנס?'],[8,'בצל נרדם על הספסל / וחלם על קרנבל'],[9,'קוקוס ברח מהמטוס / ופגש תרנגול מאוד מנומס'],[10,'תות לבש מגפיים / ויצא לעוף בשמיים'],[11,'גזר קפץ למקרר / וצעק: אני זמר!'],[12,'עגבנייה רקדה בגינה / עם כפכף ועם גבינה!'],[13,'פיתה טסה בכיתה / ונחתה בתוך מיטה!'],[14,'קורנפלקס נכנס לטקס / ועשה לכולם פלקס!'],[15,'שוקולד עלה על גלגל / ונפל ישר לתוך הסל!'],[16,'חומוס רץ עם קקטוס / ושניהם פספסו אוטובוס!'],[17,'פסטה לבשה אפודה / ויצאה לרקוד עם סודה!'],[18,'די די די? לא לא לא! / עוד שיר קטן וזה נגמר — בכלל לא נגמר!'],[19,'לאט לאט עולה הקצב / אחת שתיים שלוש — מהר יותר!'],[20,'הו, מלפפון אבוד שלי! / למה ברחת מהסלט שלי?'],[21,'גרב רקדה עם מגבת / ונפלה ישר לצלחת!'],[22,'כפית טיפסה על כרית / והכריזה: אני חללית!'],[23,'כל הבית שר עכשיו! / דלת, כיסא וגם גרב — כולם ביחד!'],[24,'זה השיר שלא נגמר! / מהר יותר! חזק יותר! לה לה לה!']];const KEY='dad-song-approvals-v2';let current=null,currentSection=null;const state=JSON.parse(localStorage.getItem(KEY)||'{}');const list=document.getElementById('list');function file(n){return base+'dad-song-'+String(n).padStart(2,'0')+'.mp3'}function stopAudio(){if(current){current.pause();current.currentTime=0;current=null}if(currentSection){currentSection.classList.remove('is-playing');currentSection=null}}function setStatus(sec,n,status){state[n]=status;localStorage.setItem(KEY,JSON.stringify(state));sec.dataset.status=status;sec.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',b.dataset.value===status));updateCount()}function updateCount(){const vals=Object.values(state);document.getElementById('count').textContent='סומנו '+vals.length+'/24 · מאושרים '+vals.filter(v=>v==='ok').length}for(const [n,title] of songs){const sec=document.createElement('section');sec.className='song';sec.dataset.song=n;sec.innerHTML='<div class="num">'+n+'</div><div><div class="title">'+title+'</div><div class="actions"><button class="play">▶ נגן</button><button class="stop">■ עצור</button><span class="playing">🔊 מנגן עכשיו</span></div><div class="choices" style="margin-top:10px"><button class="choice" data-value="ok">✅ מאושר</button><button class="choice" data-value="bad">❌ קול לא נכון</button><button class="choice" data-value="redo">🔁 ליצור מחדש</button></div></div>';sec.querySelector('.play').onclick=async()=>{stopAudio();const a=new Audio(file(n));a.preload='auto';current=a;currentSection=sec;sec.classList.add('is-playing');a.onended=stopAudio;a.onerror=()=>{stopAudio();alert('השיר '+n+' לא נטען. רענן את העמוד ונסה שוב.')};try{await a.play()}catch(e){stopAudio();alert('הדפדפן חסם את ההשמעה. לחץ שוב על נגן.') }};sec.querySelector('.stop').onclick=stopAudio;sec.querySelectorAll('.choice').forEach(b=>b.onclick=()=>setStatus(sec,n,b.dataset.value));if(state[n])setStatus(sec,n,state[n]);list.appendChild(sec)}updateCount();document.getElementById('summaryBtn').onclick=()=>{document.getElementById('summary').value=songs.map(([n])=>n+' — '+(state[n]==='ok'?'✅ מאושר':state[n]==='bad'?'❌ קול לא נכון':state[n]==='redo'?'🔁 ליצור מחדש':'⬜ לא נבדק')).join('\n')};document.getElementById('copyBtn').onclick=async()=>{document.getElementById('summaryBtn').click();const t=document.getElementById('summary');try{await navigator.clipboard.writeText(t.value);alert('הסיכום הועתק')}catch(e){t.select();document.execCommand('copy');alert('הסיכום הועתק')}};document.getElementById('clearBtn').onclick=()=>{if(!confirm('לנקות את כל הסימונים?'))return;for(const k of Object.keys(state))delete state[k];localStorage.removeItem(KEY);document.querySelectorAll('.song').forEach(s=>{s.dataset.status='';s.querySelectorAll('.choice').forEach(b=>b.classList.remove('active'))});updateCount();document.getElementById('summary').value=''};</script></body></html>
