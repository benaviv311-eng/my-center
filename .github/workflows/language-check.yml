name: Language JavaScript Check

on:
  push:
    branches: [main]
    paths:
      - 'language-*.js'
      - 'language-*.html'
      - 'four-languages.*'
      - 'languages.html'
      - 'tests/language-*.test.js'
      - '.github/workflows/language-check.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check language JavaScript syntax
        run: |
          node --check language-core.js
          node --check language-study.js
          node --check language-topics.js
          node --check language-archive.js
          if [ -f language-topic-expansion.js ]; then node --check language-topic-expansion.js; fi
          if [ -f four-languages.js ]; then node --check four-languages.js; fi
          if [ -f language-vocabulary.js ]; then node --check language-vocabulary.js; fi
          if [ -f language-vocabulary-link.js ]; then node --check language-vocabulary-link.js; fi
      - name: Run expanded topics and four-language tests
        run: node tests/language-topics-four.test.js
      - name: Run vocabulary by topic tests
        run: node tests/language-vocabulary.test.js
