name: Apply Crazy Family Movie Set Task 1

on:
  push:
    branches:
      - feature/crazy-family-playable-movie-set
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply movie-set shell patch
        run: python scripts/apply-crazy-family-movie-set-task1.py
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crazy-family.html
          git commit -m 'feat: wire crazy family 3d runtime shell'
          git push origin HEAD:feature/crazy-family-playable-movie-set
