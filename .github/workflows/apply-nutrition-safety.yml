name: Apply nutrition safety

on:
  push:
    paths:
      - '.github/workflows/apply-nutrition-safety.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach nutrition safety script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nutrition-builder.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="nutrition-meals.js?v=1"></script>','<script src="nutrition-meals.js?v=2"></script>')
          tag='<script src="nutrition-safety.js?v=1"></script>'
          anchor='<script src="nutrition-profile-meals.js?v=1"></script>'
          if tag not in s:
              assert anchor in s, 'meal profile script anchor missing'
              s=s.replace(anchor,anchor+'\n'+tag,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'nutrition-meals.js?v=2' nutrition-builder.html
          grep -q 'nutrition-safety.js?v=1' nutrition-builder.html
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nutrition-builder.html
          git commit -m "Enable nutrition calorie and portion safeguards"
          git push
