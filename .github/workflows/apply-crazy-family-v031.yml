name: Apply Crazy Family v0.31 Grounded

on:
  push:
    paths:
      - 'scripts/apply-crazy-family-v031-grounded.py'
      - '.github/workflows/apply-crazy-family-v031.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest main
        run: |
          git fetch origin main
          git rebase origin/main || true
      - name: Apply grounded side-scroll patch
        run: python scripts/apply-crazy-family-v031-grounded.py
      - name: Run v0.30 regression checks
        run: python scripts/test-crazy-family-v030.py
      - name: Run v0.31 grounded movement checks
        run: python scripts/test-crazy-family-v031.py
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('crazy-family.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/crazy-family-v031.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/crazy-family-v031.js
      - name: Commit v0.31
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crazy-family.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: ground stage 1 movement v0.31"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
