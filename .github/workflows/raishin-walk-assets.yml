name: Stage Raishin walk assets

on:
  push:
    branches:
      - feat/raishin-walk-free-roam
    paths:
      - '.github/workflows/raishin-walk-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/raishin-walk-free-roam

      - name: Download dojo and walk-cycle assets
        env:
          DOJO_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/98cc86e4-1a1e-480f-9ac1-b23074cec3db.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDRkMWZjNDJjMWM4MDY5OSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTc2MzI2Nn0.Wbm4ctgdcUdNX1tDKMrMDMhe5S-CiVeETkmmCWtB0Ys"
          SPRITE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/4f0266e8-8f41-4420-a8bf-2cbcc21c18d2.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWE4MjZhYzIxM2FlYzBkZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTczMjkzMH0.RASloMJl_vNWfwbK7Bz5L70Id_ZuNOLaEweDAF1lgJU"
        run: |
          mkdir -p raishin-legacy/assets/gameplay raishin-legacy/assets/player
          curl --fail --location --retry 3 "$DOJO_URL" -o raishin-legacy/assets/gameplay/inazuma-main-hall-clean.png
          curl --fail --location --retry 3 "$SPRITE_URL" -o raishin-legacy/assets/player/raika-walk-4dir-8f.png
          test -s raishin-legacy/assets/gameplay/inazuma-main-hall-clean.png
          test -s raishin-legacy/assets/player/raika-walk-4dir-8f.png

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raishin-legacy/assets/gameplay/inazuma-main-hall-clean.png raishin-legacy/assets/player/raika-walk-4dir-8f.png
          if git diff --cached --quiet; then
            echo "Assets already present."
            exit 0
          fi
          git commit -m "feat: add Inazuma background and Raika walk-cycle assets"
          git push origin HEAD:feat/raishin-walk-free-roam
