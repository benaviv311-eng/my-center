name: Assemble nutrition builder upgrade

on:
  push:
    paths:
      - '.github/workflows/nutrition-builder-assemble.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble page
        shell: bash
        run: |
          cat .nutrition-upgrade/part01.txt \
              .nutrition-upgrade/part02.txt \
              .nutrition-upgrade/part03.txt \
              .nutrition-upgrade/part04.txt \
              .nutrition-upgrade/part05.txt \
              .nutrition-upgrade/part06.txt > nutrition-builder.html
          test -s nutrition-builder.html
          grep -q "GOV_MAIN_RESOURCE" nutrition-builder.html
          grep -q "humanQuantity" nutrition-builder.html
          grep -q "גרעיני דלעת" nutrition-builder.html
          grep -q "אוכמניות" nutrition-builder.html
          python - <<'PY'
          from pathlib import Path
          s=Path('nutrition-builder.html').read_text()
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/nutrition-inline.js').write_text(js)
          print('nutrition-builder bytes:', len(s.encode()))
          PY
          node --check /tmp/nutrition-inline.js

      - name: Commit assembled page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nutrition-builder.html
          git rm -r .nutrition-upgrade
          git rm .github/workflows/nutrition-builder-assemble.yml
          git commit -m "Upgrade nutrition builder data and portions"
          git push
