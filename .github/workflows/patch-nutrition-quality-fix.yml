name: Apply nutrition quality fix

on:
  push:
    paths:
      - 'tools/patch-nutrition-quality-fix.mjs'
      - '.github/workflows/patch-nutrition-quality-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nutrition-professional-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/patch-nutrition-quality-fix.mjs
      - run: node --check nutrition-meals.js
      - run: node --check nutrition-planner.js
      - run: node --test tests/nutrition-meals.test.mjs tests/nutrition-profile.test.mjs tests/nutrition-planner.test.mjs tests/nutrition-quality.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nutrition-builder.html nutrition-meals.js nutrition-planner.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: add professional nutrition quality checks"
          git push origin HEAD:nutrition-professional-engine
