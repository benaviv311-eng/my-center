name: Language Feed Test
on:
  push:
    branches: [main]
    paths:
      - 'language-feed-model.js'
      - 'languages-feed.js'
      - 'languages-feed.css'
      - 'languages.html'
      - 'tests/language-feed.test.js'
      - '.github/workflows/language-feed-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check feed JavaScript syntax
        run: |
          node --check language-feed-model.js
          node --check languages-feed.js
      - name: Run feed behavior tests
        run: node tests/language-feed.test.js
