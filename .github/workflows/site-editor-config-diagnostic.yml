name: Site editor config diagnostic
on:
  push:
    branches:
      - feature/site-chat-site-editor-final
    paths:
      - '.github/workflows/site-editor-config-diagnostic.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase editor config flags
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://iwemlxvjyhffumzcqrxf.supabase.co/functions/v1/site-editor-config-diagnostic
