name: Import Score Counter backgrounds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-score-backgrounds.yml'

permissions:
  contents: write

jobs:
  import-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download high-quality backgrounds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p score-counter/assets/backgrounds
          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/9fe35dd3-4ce7-418a-998e-161b85e9e7f9.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGZlMDVkZTdiMDA5MGE3NCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTExNDQ3MX0.twwmSlzSQ0Sl4wS28poYizjag3wsffE4thDQrPg0qe4' -o score-counter/assets/backgrounds/bg01.webp
          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/f2d364ee-0240-498f-91bf-29cf31afb43b.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDU0YTU1OTdmNDRlZWYwZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE0ODE4M30.Zh1duoGvAdMBUvnrpDzALcJEAgPV3hU8aEoNuwnSyXo' -o score-counter/assets/backgrounds/bg02.webp
          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/6d6731c3-1048-41dd-9bdd-3a078e12ed40.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOWYwOWQyZmZiMjNiMzczZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE3NDc4M30.bFCJqdsW6ZRUVj2vEFr9FFzOT2Afm2Y-e0Tj4vmpWRY' -o score-counter/assets/backgrounds/bg03.webp
          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/3b7db5cd-3fbd-44d3-9ef1-6e8b31f99650.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYmE4ZTQwYTc1ODYzYWI1NiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTExNjgzOX0.LdYVHfBLexImJMggh7vHDSJPLwlZ7YZxqHizgpIQEIM' -o score-counter/assets/backgrounds/bg04.webp
          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/78563ead-7e0c-4ed0-8873-56a121345d28.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMmI0N2YwZTk0YTc0ZjQzYSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE4NzgxN30.LITaZTFJcG-zbFiHGlHJHSEC8XnI6QYtBTNAthXz8nY' -o score-counter/assets/backgrounds/bg05.webp
          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/715dd962-9f4c-46fa-8fa4-25ee2007bd8d.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjMzMTZiNTMwMGNkMjc4MiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE0MjA5OX0.rlQWnlYibaZgRopElW6YQC4Lj63RHeUEAk90cdnZzEY' -o score-counter/assets/backgrounds/bg06.webp
          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/68bed158-b425-4205-b91f-af09aa197b87.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzhiYjY4MzkyNGQ2ZTFlNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE4NDMxM30.2JpsfwVGM62XNlRrnFQ3sfYpnXl_uLkgG5AWZNbKqAw' -o score-counter/assets/backgrounds/bg07.webp
          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/b6fb78f3-831e-4a49-9bfd-0ca4f643952f.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiM2M5N2VlNmRiNmJhNWU2YSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE2NTkzM30.QZ9wDVtHVsUZydkh3FTKdawwpJBud9uBHPR_glWsuM8' -o score-counter/assets/backgrounds/bg08.webp

          for f in score-counter/assets/backgrounds/*.webp; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            test "$size" -gt 150000
          done

      - name: Commit backgrounds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add score-counter/assets/backgrounds/*.webp
          if git diff --cached --quiet; then
            echo 'No background changes to commit.'
            exit 0
          fi
          git commit -m 'Add high-quality Score Counter backgrounds'
          git push
