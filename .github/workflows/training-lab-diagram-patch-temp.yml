name: Training Lab Diagram Patch Temp

on:
  push:
    branches:
      - feature/coach-training-lab-diagrams
    paths:
      - '.github/workflows/training-lab-diagram-patch-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coach-training-lab-diagrams
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply staged patch
        run: python .tmp/training-lab-diagram-patch.py
      - name: Run focused training lab tests
        run: |
          node --test tests/coach-training-lab-diagrams.test.js tests/coach-training-lab.test.js tests/coach-training-lab-integration.test.js
          node --check coach-training-lab-data.js
          node --check coach-training-lab-diagrams.js
          node --check coach-training-lab.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-training-lab.js coach-training-lab.css
          git commit -m "feat: render drill diagrams in training lab details"
          git push origin HEAD:feature/coach-training-lab-diagrams
