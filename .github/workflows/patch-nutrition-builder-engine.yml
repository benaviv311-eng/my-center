name: Apply nutrition builder engine patch

on:
  push:
    paths:
      - 'tools/patch-nutrition-builder-engine.mjs'
      - '.github/workflows/patch-nutrition-builder-engine.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nutrition-professional-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/patch-nutrition-builder-engine.mjs
      - run: node --test tests/nutrition-meals.test.mjs tests/nutrition-profile.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nutrition-builder.html
          git diff --cached --quiet && exit 0
          git commit -m "refactor: use canonical nutrition profile storage"
          git push origin HEAD:nutrition-professional-engine
