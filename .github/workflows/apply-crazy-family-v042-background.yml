name: Apply Crazy Family v0.42 Cinematic Background

on:
  push:
    branches:
      - feature/crazy-family-hybrid-cinematic-set-spec
    paths:
      - 'tmp/crazy-family-v042-bg-*.b64'
      - '.github/workflows/apply-crazy-family-v042-background.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble cinematic background
        run: |
          cat tmp/crazy-family-v042-bg-*.b64 > /tmp/crazy-family-v042-background.b64
          base64 -d /tmp/crazy-family-v042-background.b64 > assets/crazy-family/cinematic-home-v042/background.webp
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('assets/crazy-family/cinematic-home-v042/background.webp')
          b=p.read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', 'not a valid WebP'
          assert len(b) == 75470, len(b)
          assert hashlib.sha256(b).hexdigest() == 'fa1ee545c6af8f9ab9ca16569290396b9abfea562507cdb04076856c5facbfb8'
          print('PASS:', p, len(b), hashlib.sha256(b).hexdigest())
          PY
      - name: Commit cinematic background
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add assets/crazy-family/cinematic-home-v042/background.webp
          git diff --cached --quiet && exit 0
          git commit -m "feat: use approved Crazy Family cinematic home master"
          git pull --rebase origin feature/crazy-family-hybrid-cinematic-set-spec
          git push origin HEAD:feature/crazy-family-hybrid-cinematic-set-spec
