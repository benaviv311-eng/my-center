name: Crazy Family Dad ability 1

on:
  push:
    paths:
      - 'crazy-family.html'
      - 'crazy-family/attack-visuals.js'
      - 'tests/crazy-family-dad-ability-01-low-wave.test.js'
      - '.github/workflows/crazy-family-dad-ability-01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-low-wave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Dad ability 1 low wave
        run: node tests/crazy-family-dad-ability-01-low-wave.test.js
