name: Crazy Family Frequency Update

on:
  push:
    paths:
      - '.github/workflows/crazy-family-frequency.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-frequency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase Dad chatter frequency
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crazy-family.html')
          s = p.read_text(encoding='utf-8')
          old_ver = 'עולם הבית · חקירה חופשית · v0.11'
          new_ver = 'עולם הבית · חקירה חופשית · v0.12'
          old_cadence = 'nextFarChatterAt=performance.now()+3200+Math.random()*2200;'
          new_cadence = 'nextFarChatterAt=performance.now()+1400+Math.random()*900;'
          if old_ver not in s:
              raise SystemExit('version marker not found')
          if old_cadence not in s:
              raise SystemExit('cadence marker not found')
          s = s.replace(old_ver, new_ver, 1)
          s = s.replace(old_cadence, new_cadence, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add crazy-family.html
          git commit -m "Increase Dad chatter frequency"
          git push
