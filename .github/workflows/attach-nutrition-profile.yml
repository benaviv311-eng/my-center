name: Attach nutrition profile

on:
  push:
    paths:
      - '.github/workflows/attach-nutrition-profile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach persistent profile script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nutrition-builder.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="nutrition-profile.js?v=1"></script>'
          if tag not in s:
              assert '</body>' in s, 'nutrition-builder.html has no closing body tag'
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          grep -q 'nutrition-profile.js?v=1' nutrition-builder.html
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nutrition-builder.html
          git commit -m "Enable persistent nutrition profile"
          git push
