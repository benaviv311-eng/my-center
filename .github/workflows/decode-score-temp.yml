name: Decode Score Temp
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decode-score-temp.yml'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode app
        shell: bash
        run: |
          set -euo pipefail
          cat team-score/t1.txt team-score/t2.txt team-score/t3.txt team-score/t4.txt | base64 -d | gzip -dc > team-score/decoded-temp.html
      - name: Commit decoded source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team-score/decoded-temp.html
          git commit -m 'Temporary decode TeamScore source' || exit 0
          git push
