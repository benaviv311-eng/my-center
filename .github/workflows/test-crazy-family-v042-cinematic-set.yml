name: Crazy Family v0.42 Cinematic Set

on:
  push:
    branches:
      - feature/crazy-family-hybrid-cinematic-set-spec
    paths:
      - 'crazy-family/**'
      - 'tests/crazy-family/**'
      - 'assets/crazy-family/cinematic-home-v042/**'
      - 'scripts/test-crazy-family-v042-assets.py'
      - 'crazy-family.html'
      - '.github/workflows/test-crazy-family-v042-cinematic-set.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v0.42 asset contract
        run: python3 scripts/test-crazy-family-v042-assets.py
      - name: Verify Crazy Family node tests
        run: node --test tests/crazy-family/*.test.mjs
      - name: Verify Crazy Family JavaScript syntax
        run: |
          for f in crazy-family/*.js; do node --check "$f"; done
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/crazy-family-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/crazy-family.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/crazy-family-http.log
          exit 1
      - name: Run real-browser cinematic acceptance
        run: node tests/crazy-family/browser-smoke.mjs
      - name: Upload cinematic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazy-family-v042-cinematic-set
          path: artifacts/
          if-no-files-found: warn
