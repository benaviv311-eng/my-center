name: Coach Feed Tests

on:
  push:
    branches: ['feature/coach-feed-learning', 'feature/coach-performance-hub']
  pull_request:
    paths:
      - 'coach.html'
      - 'coach-feed.css'
      - 'coach-feed.js'
      - 'coach-feed-data.js'
      - 'coach-hub.js'
      - 'coach-hub.css'
      - 'tests/coach-feed.test.js'
      - 'tests/coach-performance-hub.test.js'
      - 'tests/coach-volleyball-navigation.test.js'
      - '.github/workflows/coach-feed-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full test suite
        run: node --test tests/*.test.js
      - name: Check coach scripts
        run: |
          node --check coach-feed-data.js
          node --check coach-feed.js
          node --check coach-hub.js
