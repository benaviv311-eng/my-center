name: Score Counter drag test
on:
  push:
    branches: [main]
    paths:
      - 'score-counter/index.html'
      - 'score-counter/score-drag.js'
      - 'score-counter/score-drag.css'
      - '.github/workflows/score-counter-drag-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify draggable score cards
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('score-counter/index.html','utf8');
          if(!fs.existsSync('score-counter/score-drag.js')){
            console.error('Missing score-counter/score-drag.js');
            process.exit(1);
          }
          const js=fs.readFileSync('score-counter/score-drag.js','utf8');
          const required=[
            'team-score-card-positions-v1',
            'LONG_PRESS_MS=380',
            'MOVE_CANCEL_PX=28',
            'data-score-drag-ready',
            'latestClientX',
            'latestClientY',
            'startClientX=latestClientX',
            'startClientY=latestClientY',
            'איפוס מיקום הכרטיסים',
            'MutationObserver',
            'pointerdown',
            'pointermove',
            'pointerup'
          ];
          const missing=required.filter(x=>!js.includes(x));
          if(/card\.style\.transform=.*scale\(/.test(js)) missing.push('whole-card scale transform');
          if(!index.includes('score-drag.js') || !index.includes('score-drag.css')) missing.push('loader assets');
          if(missing.length){
            console.error('Missing drag behavior markers:', missing.join(', '));
            process.exit(1);
          }
          console.log('Continuous long-press score card drag markers present.');
          NODE
          node --check score-counter/score-drag.js
