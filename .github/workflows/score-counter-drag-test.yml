name: Score Counter drag test
on:
  push:
    branches: [main]
    paths:
      - 'score-counter/index.html'
      - 'score-counter/score-drag.js'
      - 'score-counter/score-drag.css'
      - '.github/workflows/score-counter-drag-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify whole-card long-press dragging
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('score-counter/index.html','utf8');
          if(!fs.existsSync('score-counter/score-drag.js')){
            console.error('Missing score-counter/score-drag.js');
            process.exit(1);
          }
          const js=fs.readFileSync('score-counter/score-drag.js','utf8');
          const css=fs.readFileSync('score-counter/score-drag.css','utf8');
          const required=[
            'team-score-card-positions-v1',
            'LONG_PRESS_MS=380',
            'MOVE_CANCEL_PX=28',
            'data-score-drag-ready',
            'latestClientX',
            'latestClientY',
            'startClientX=latestClientX',
            'startClientY=latestClientY',
            'suppressNextClick',
            'score-resize-handle,.score-size-menu',
            "card.addEventListener('pointerdown'",
            "card.addEventListener('pointermove'",
            "card.addEventListener('pointerup'",
            "card.addEventListener('click'",
            "scale('+scale.toFixed(3)+')",
            'איפוס מיקום הכרטיסים',
            'MutationObserver'
          ];
          const missing=required.filter(x=>!js.includes(x));
          if(js.includes("e.pointerType==='touch'")) missing.push('touch pointer path still bypassed');
          if(js.includes('isInteractive(e.target)')) missing.push('interactive card content still blocks long-press drag');
          if(!css.includes('touch-action:pan-y')) missing.push('touch-action:pan-y');
          if(!index.includes('score-drag.js') || !index.includes('score-drag.css')) missing.push('loader assets');
          if(missing.length){
            console.error('Missing whole-card drag behavior:', missing.join(', '));
            process.exit(1);
          }
          console.log('Whole-card long-press drag markers present with resize scale composition.');
          NODE
          node --check score-counter/score-drag.js
