name: Score Counter centered column test
on:
  push:
    branches: [main]
    paths:
      - 'score-counter/index.html'
      - 'score-counter/score-live.css'
      - 'score-counter/score-live.js'
      - '.github/workflows/score-counter-drag-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify cards stay in one centered column near the top
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('assert');
          const fs=require('fs');
          const index=fs.readFileSync('score-counter/index.html','utf8');
          const css=fs.readFileSync('score-counter/score-live.css','utf8');
          const js=fs.readFileSync('score-counter/score-live.js','utf8');
          assert(!index.includes('score-drag.js'),'drag JS must not be loaded in the fixed column view');
          assert(!index.includes('score-drag.css'),'drag CSS must not be loaded in the fixed column view');
          assert(js.includes("teams.classList.add('score-final-column')"),'final column class must be applied');
          assert(css.includes('#teams.score-final-column'),'final column CSS missing');
          assert(css.includes('flex-direction:column!important'),'cards must form one vertical column');
          assert(css.includes('align-items:center!important'),'cards must stay horizontally centered');
          assert(css.includes('transform:none!important'),'old drag transforms must not affect the final layout');
          assert(css.includes('padding:108px 12px 56px!important'),'desktop column must sit just below the top header');
          assert(css.includes('padding-top:100px!important'),'mobile column must sit just below the top header');
          assert(!css.includes('padding:50vh 12px 56px!important'),'old mid-screen desktop offset must be removed');
          assert(!css.includes('padding-top:50vh!important'),'old mid-screen mobile offset must be removed');
          NODE
          node --check score-counter/score-live.js
