name: Site editor GitHub diagnostic

on:
  push:
    branches:
      - feature/site-chat-site-editor-core
    paths:
      - '.github/workflows/site-editor-github-diagnostic.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub App connection
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          status="$(curl --silent --show-error --output "$tmp" --write-out "%{http_code}" https://iwemlxvjyhffumzcqrxf.supabase.co/functions/v1/site-editor-github-diagnostic)"
          body="$(cat "$tmp")"
          echo "status=$status body=$body"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true) process.exit(1)' "$body"
