name: Source expansion tests

on:
  push:
    branches: [main]
    paths:
      - 'book.html'
      - 'source-expander.js'
      - 'source-expander.css'
      - 'tests/source-expansion.test.js'
      - '.github/workflows/source-expansion-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/source-expansion.test.js
      - run: node --check source-expander.js
