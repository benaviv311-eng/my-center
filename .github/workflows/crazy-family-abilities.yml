name: Crazy Family Abilities Build

on:
  push:
    paths:
      - '.github/workflows/crazy-family-abilities.yml'
      - '.github/scripts/crazy_family_abilities.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify ability engine
        run: python3 .github/scripts/crazy_family_abilities.py
      - name: Commit verified game
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add crazy-family.html
          git diff --cached --quiet && exit 0
          git commit -m "Build Dad attack and Libi defense ability engine"
          git push
