name: Score Counter background layout test
on:
  push:
    branches: [main]
    paths:
      - 'score-counter/index.html'
      - '.github/workflows/score-counter-bg-layout-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify half-width filled stage with uncropped athlete
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('score-counter/index.html','utf8');
          const required=[
            'background:#000',
            '#sharpBg::before',
            'left:25vw',
            'width:50vw',
            'height:100vh',
            'background-image:var(--sharp-bg)',
            'background-size:cover',
            'object-fit:contain',
            'style.setProperty("--sharp-bg"'
          ];
          const missing=required.filter(x=>!s.includes(x));
          if(missing.length){
            console.error('Missing filled-stage layout markers:', missing.join(', '));
            process.exit(1);
          }
          console.log('Half-width filled stage and uncropped athlete markers present.');
          NODE
