name: Nutrition professional tests

on:
  push:
    paths:
      - 'tests/nutrition-*.test.mjs'
      - 'nutrition-meals.js'
      - 'nutrition-safety.js'
      - 'nutrition-profile.js'
      - 'nutrition-profile-meals.js'
      - 'nutrition-planner.js'
      - 'nutrition-builder.html'
      - '.github/workflows/nutrition-meals-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check nutrition-meals.js
      - run: node --check nutrition-safety.js
      - run: if [ -f nutrition-profile.js ]; then node --check nutrition-profile.js; fi
      - run: if [ -f nutrition-planner.js ]; then node --check nutrition-planner.js; fi
      - run: node --test tests/nutrition-*.test.mjs
