name: Apply Crazy Family Stage 1 v0.26

on:
  push:
    paths:
      - '.github/workflows/apply-crazy-family-stage1-v026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved Stage 1 house art
        env:
          STAGE1_URL_B64: ""
        run: |
          mkdir -p assets/crazy-family
          STAGE1_URL="$(printf '%s' "$STAGE1_URL_B64" | base64 -d)"
          curl -fL --retry 3 "$STAGE1_URL" -o assets/crazy-family/stage1-home-v026.png
          test "$(stat -c%s assets/crazy-family/stage1-home-v026.png)" -gt 50000
          file assets/crazy-family/stage1-home-v026.png | grep -q 'PNG image data'

      - name: Patch Stage 1 visual and panoramic camera
        shell: python
        run: |
          from pathlib import Path
          p=Path('crazy-family.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('עולם הבית · חקירה חופשית · v0.25','עולם הבית · שלב 1: מפגש אבא · v0.26')
          s=s.replace("ground:'assets/crazy-family/ground.webp'","ground:'assets/crazy-family/stage1-home-v026.png'")
          old="""function draw(){
 const img=art[player.scene];
 if(img&&img.complete&&img.naturalWidth){
   ctx.drawImage(img,0,0,W,H);
   const g=ctx.createLinearGradient(0,0,0,H);"""
          new="""function drawStage1Panorama(img){
 const targetAspect=W/H,srcAspect=img.naturalWidth/img.naturalHeight;
 if(srcAspect>targetAspect){
   const sw=img.naturalHeight*targetAspect;
   const maxSx=Math.max(0,img.naturalWidth-sw);
   const camera=Math.max(0,Math.min(1,player.x/W));
   const sx=maxSx*camera;
   ctx.drawImage(img,sx,0,sw,img.naturalHeight,0,0,W,H);
 }else{
   const sh=img.naturalWidth/targetAspect;
   const sy=Math.max(0,(img.naturalHeight-sh)*.5);
   ctx.drawImage(img,0,sy,img.naturalWidth,sh,0,0,W,H);
 }
}
function draw(){
 const img=art[player.scene];
 if(img&&img.complete&&img.naturalWidth){
   if(player.scene==='ground')drawStage1Panorama(img);else ctx.drawImage(img,0,0,W,H);
   const g=ctx.createLinearGradient(0,0,0,H);"""
          if old not in s:
              raise SystemExit('draw block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Verify Stage 1 visual
        run: |
          grep -q 'v0.26' crazy-family.html
          grep -q 'stage1-home-v026.png' crazy-family.html
          grep -q 'function drawStage1Panorama' crazy-family.html
          grep -q "player.scene==='ground'" crazy-family.html
          test -s assets/crazy-family/stage1-home-v026.png

      - name: Commit Stage 1 visual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crazy-family.html assets/crazy-family/stage1-home-v026.png
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add cinematic panoramic Stage 1 home'
          git push
