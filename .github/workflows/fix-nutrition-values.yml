name: Fix nutrition quantity values

on:
  push:
    paths:
      - '.github/workflows/fix-nutrition-values.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch builder
        run: echo '   xkaXYgY2xhc3M9Im1vZGFsLWNhcmQiPjxkaXYgc3R5bGU9ImRpc3BsYXk6ZmxleDtqdXN0aWZ5LWNvbnRlbnQ6c3BhY2UtYmV0d2VlbjtnYXA6MTBweDthbGlnbi1pdGVtczpjZW50ZXIiPjxkaXY+PGgyIHN0eWxlPSJtYXJnaW46MCI+JHtmb29kLm5hbWV9PC9oMj48ZGl2IGNsYXNzPSJtdXRlZCI+16LXqNeb15nXnSDXnC3igJoke01hdGgucm91bmQoYW1vdW50KX0g15LXqNe  ' | tr -d ' ' | base64 -d > /tmp/patch.py && python /tmp/patch.py
      - name: Commit builder patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nutrition-builder.html
          git diff --cached --quiet || git commit -m "Use actual grams in nutrition values and refresh scripts"
          git push
