name: Fix nutrition quantity values

on:
  push:
    paths:
      - '.github/workflows/fix-nutrition-values.yml'
      - '.github/scripts/patch_nutrition_builder.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch builder
        run: python .github/scripts/patch_nutrition_builder.py
      - name: Check patch
        run: |
          grep -F 'function showFoodValues(food,grams=100)' nutrition-builder.html
          grep -F 'showFoodValues(f,q)' nutrition-builder.html
          grep -F 'ערכים ל־${Math.round(amount)} גרם' nutrition-builder.html
          grep -F 'nutrition-meals.js?v=3' nutrition-builder.html
          grep -F 'nutrition-profile-meals.js?v=2' nutrition-builder.html
      - name: Commit builder patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nutrition-builder.html
          git diff --cached --quiet || git commit -m "Fix nutrition values and builder responsiveness"
          git push
