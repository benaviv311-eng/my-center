name: Site chat tests

on:
  push:
    branches:
      - main
      - 'feature/site-chat-*'
      - 'feature/site-assistant-*'
  pull_request:
    paths:
      - 'app.js'
      - 'site-chat.js'
      - 'site-chat.css'
      - 'site-editor-ui.js'
      - 'site-editor-ui.css'
      - 'memory.html'
      - 'tests/site-chat.test.js'
      - 'tests/site-editor-*.test.js'
      - 'supabase/functions/site-chat/**'
      - 'supabase/functions/site-editor/**'
      - 'supabase/functions/site-preview/**'
      - 'supabase/functions/_shared/site-editor/**'
      - 'supabase/migrations/20260918_site_chat*.sql'
      - '.github/workflows/site-chat-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check site-chat.js
      - run: node --check site-editor-ui.js
      - run: node --test tests/*.test.js
