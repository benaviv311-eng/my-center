name: Replace Raishin gameplay character asset

on:
  push:
    branches:
      - fix/raishin-gameplay-character-v2
    paths:
      - '.github/workflows/raishin-gameplay-character-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-approved-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/raishin-gameplay-character-v2

      - name: Download corrected gameplay image exactly
        env:
          ASSET_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/57247075-7768-40b6-b713-04fc91c73821.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDMyMmJjNjk0NWQ3ZjZjOSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTc1MzcwNX0.z6Un8JiWp48rS0B5i68iXWqCEODHW9659ygtg7IB-Vw"
        run: |
          mkdir -p raishin-legacy/assets/gameplay
          curl --fail --location --retry 3 "$ASSET_URL" -o raishin-legacy/assets/gameplay/gameplay-hud-v1.png
          echo "98c467c527c8d3432408229a119738ab5db3006e399790ea332abb362f6c25d6  raishin-legacy/assets/gameplay/gameplay-hud-v1.png" | sha256sum -c -

      - name: Commit corrected asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raishin-legacy/assets/gameplay/gameplay-hud-v1.png
          if git diff --cached --quiet; then
            echo "Corrected asset already present."
            exit 0
          fi
          git commit -m "fix: replace Raika gameplay character visual"
          git push origin HEAD:fix/raishin-gameplay-character-v2
