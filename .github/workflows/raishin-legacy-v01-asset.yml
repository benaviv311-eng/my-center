name: Add Raishin Legacy approved gameplay asset

on:
  push:
    branches:
      - feat/raishin-legacy-game
    paths:
      - '.github/workflows/raishin-legacy-v01-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-approved-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/raishin-legacy-game

      - name: Download exact approved gameplay image
        env:
          ASSET_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/73ea85a8-8786-47e5-b4c5-3ba722fca8ae.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTljZTUxYjJmMmIwMGY3ZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTcyOTQ1OH0.1eSZVAFUqfuqU6qoz7-r5tkHnrtfhIheUrrx9wlsRwk"
        run: |
          mkdir -p raishin-legacy/assets/gameplay
          curl --fail --location --retry 3 "$ASSET_URL" -o raishin-legacy/assets/gameplay/gameplay-hud-v1.png
          echo "87dab063ca8139087ad047a6b34b2edb60322528469761802a1aae2a59659f6a  raishin-legacy/assets/gameplay/gameplay-hud-v1.png" | sha256sum -c -

      - name: Commit approved asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raishin-legacy/assets/gameplay/gameplay-hud-v1.png
          if git diff --cached --quiet; then
            echo "Approved asset already present."
            exit 0
          fi
          git commit -m "feat: add approved Raishin gameplay visual"
          git push origin HEAD:feat/raishin-legacy-game
