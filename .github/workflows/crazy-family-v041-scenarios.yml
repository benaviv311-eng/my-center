name: Crazy Family v0.41 scenarios

on:
  push:
    branches:
      - feature/crazy-family-scenarios-v041
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v0.41 scenario integration
        run: python scripts/apply-crazy-family-v041-scenarios.py
      - name: Scenario unit test
        run: node --test tests/crazy-family/scenario.test.mjs
      - name: Scenario integration contract
        run: python scripts/test-crazy-family-v041-scenario-integration.py
      - name: Crazy Family regression tests
        run: node --test tests/crazy-family/*.test.mjs
      - name: JavaScript syntax
        run: node --check crazy-family/game.js && node --check crazy-family/scenario.js && node --check crazy-family/world.js
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit verified v0.41 integration
        run: |
          if git diff --quiet -- crazy-family.html crazy-family/game.js; then
            echo "No production changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crazy-family.html crazy-family/game.js
          git commit -m "feat: wire dynamic home scenarios v0.41"
          git push
