name: Site editor GitHub secret flags
on:
  push:
    branches:
      - feature/site-chat-site-editor-final
    paths:
      - '.github/workflows/site-editor-secret-flags.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HAS_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      HAS_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
    steps:
      - name: Print presence flags only
        run: |
          echo "SUPABASE_ACCESS_TOKEN=$HAS_ACCESS_TOKEN"
          echo "SUPABASE_DB_PASSWORD=$HAS_DB_PASSWORD"
