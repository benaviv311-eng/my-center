name: Crazy Family Jump Space

on:
  push:
    paths:
      - '.github/workflows/crazy-family-jump-space.yml'
      - '.github/scripts/crazy_family_jump_space.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update and verify controls
        run: python3 .github/scripts/crazy_family_jump_space.py
      - name: Commit verified game
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add crazy-family.html
          git diff --cached --quiet && exit 0
          git commit -m "Map jump to Space"
          git push
