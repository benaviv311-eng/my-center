name: Raishin Legacy tests

on:
  pull_request:
    paths:
      - 'raishin-legacy/**'
      - 'tests/raishin-*.test.js'
      - '.github/workflows/raishin-legacy-test.yml'
  push:
    branches:
      - main
    paths:
      - 'raishin-legacy/**'
      - 'tests/raishin-*.test.js'
      - '.github/workflows/raishin-legacy-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/raishin-*.test.js
