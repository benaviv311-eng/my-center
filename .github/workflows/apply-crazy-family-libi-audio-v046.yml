name: Apply Crazy Family Libi audio order v0.46
on:
  push:
    paths:
      - '.github/workflows/apply-crazy-family-libi-audio-v046.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RED - prove current Libi bank is still mixed
        id: red
        continue-on-error: true
        run: |
          node - <<'JS'
          const fs=require('fs');
          const s=fs.readFileSync('crazy-family.html','utf8');
          const bank=s.match(/const libiReactionBank=\{(.*?)\};/s)?.[1]||'';
          const ids=[...bank.matchAll(/i:(\d+)/g)].map(m=>Number(m[1]));
          if(ids.some(i=>i<12)) throw new Error('legacy Libi clips 1-12 are still active');
          JS
      - name: Confirm RED test actually failed
        run: |
          test "${{ steps.red.outcome }}" = "failure"
      - name: Separate Libi contextual voices
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('crazy-family.html')
          s=p.read_text(encoding='utf-8')

          new_bank="""const LIBI_AUDIO_ORDER_V046='context-only-13-39';
const libiReactionBank={
 call:[{i:12,w:1},{i:13,w:1}],
 songWarning:[{i:14,w:1},{i:15,w:1},{i:16,w:1}],
 songStart:[{i:17,w:1}],
 songOngoing:[{i:18,w:1},{i:19,w:1},{i:20,w:1}],
 chase:[{i:21,w:1},{i:22,w:1}],
 danger:[{i:23,w:1},{i:24,w:1}],
 missed:[{i:25,w:1},{i:26,w:1}],
 confused:[{i:27,w:1},{i:28,w:1},{i:29,w:1},{i:30,w:1}],
 escaped:[{i:31,w:1},{i:32,w:1}],
 songAgain:[{i:33,w:1}],
 sameSong:[{i:34,w:1}],
 dizzy:[{i:35,w:1}],
 headphones:[{i:36,w:1},{i:37,w:1},{i:38,w:1}]
};"""

          pattern=r"const rareConfusedIndex=30;\s*const libiReactionBank=\{.*?\};"
          s,n=re.subn(pattern,new_bank,s,count=1,flags=re.S)
          if n!=1:
              # Allow reruns after the marker exists.
              pattern=r"const LIBI_AUDIO_ORDER_V046='context-only-13-39';\s*const libiReactionBank=\{.*?\};"
              s,n=re.subn(pattern,new_bank,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Libi reaction bank not found')

          s=s.replace('עולם הבית · שלב 1: מפגש אבא · v0.45','עולם הבית · שלב 1: מפגש אבא · v0.46',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: GREEN - verify exact Libi voice ownership
        run: |
          node - <<'JS'
          const fs=require('fs');
          const s=fs.readFileSync('crazy-family.html','utf8');
          if(!s.includes("const LIBI_AUDIO_ORDER_V046='context-only-13-39'")) throw new Error('v0.46 marker missing');
          const bank=s.match(/const libiReactionBank=\{(.*?)\};/s)?.[1]||'';
          const expected={
            call:[12,13],songWarning:[14,15,16],songStart:[17],songOngoing:[18,19,20],
            chase:[21,22],danger:[23,24],missed:[25,26],confused:[27,28,29,30],
            escaped:[31,32],songAgain:[33],sameSong:[34],dizzy:[35],headphones:[36,37,38]
          };
          for(const [name,ids] of Object.entries(expected)){
            const m=bank.match(new RegExp(name+':\\[(.*?)\\]','s'));
            if(!m) throw new Error(`missing ${name}`);
            const got=[...m[1].matchAll(/i:(\d+)/g)].map(x=>Number(x[1]));
            if(JSON.stringify(got)!==JSON.stringify(ids)) throw new Error(`${name}: ${got} != ${ids}`);
          }
          const all=[...bank.matchAll(/i:(\d+)/g)].map(m=>Number(m[1]));
          const unique=[...new Set(all)].sort((a,b)=>a-b);
          const wanted=Array.from({length:27},(_,k)=>k+12);
          if(JSON.stringify(unique)!==JSON.stringify(wanted)) throw new Error(`active clip set wrong: ${unique}`);
          if(all.length!==27) throw new Error(`clips are reused across categories: ${all.length} entries`);
          const voice=s.match(/const libiVoiceClips=\[(.*?)\];\s*libiVoiceClips\.forEach/s)?.[1]||'';
          const refs=[...voice.matchAll(/libi-(\d{2})\.mp3/g)].map(m=>Number(m[1]));
          if(refs.length!==39 || refs[0]!==1 || refs[38]!==39) throw new Error('39 Libi source files must remain preserved');
          if(!s.includes('const dadPreClips=[')) throw new Error('Dad dialogue was removed');
          console.log('Libi contextual bank 13-39 is exclusive and ordered: PASS');
          JS
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('crazy-family.html').read_text(encoding='utf-8')
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'src=' in attrs.lower() or 'importmap' in attrs.lower():
                  continue
              scripts.append(body)
          Path('/tmp/crazy-family-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/crazy-family-inline.js
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crazy-family.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: separate Libi contextual voice clips v0.46"
          git push
