name: Crazy Family Movie Set Tests

on:
  push:
    branches:
      - feature/crazy-family-playable-movie-set
  workflow_dispatch:

permissions:
  contents: read

jobs:
  movie-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Movie-set static contract
        run: python scripts/test-crazy-family-movie-set.py
      - name: Movie-set node tests
        run: node --test tests/crazy-family/*.test.mjs
      - name: Existing Crazy Family regressions
        run: |
          python scripts/test-crazy-family-v028.py
          python scripts/test-crazy-family-v030.py
          python scripts/test-crazy-family-v031.py
          python scripts/test-crazy-family-v032-ground-contact.py
          python scripts/test-crazy-family-v034.py

  browser-smoke:
    needs: movie-set
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/crazy-family-server.log 2>&1 &
          echo $! > /tmp/crazy-family-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/crazy-family.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/crazy-family-server.log
          exit 1
      - name: Run real-browser movie-set acceptance
        run: node tests/crazy-family/browser-smoke.mjs
      - name: Upload rendered acceptance screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazy-family-movie-set-screenshot
          path: artifacts/crazy-family-movie-set.png
          if-no-files-found: ignore
