name: Crazy Family Remove Libi Powerups

on:
  push:
    paths:
      - '.github/workflows/crazy-family-remove-libi-powerups.yml'
      - '.github/scripts/crazy_family_remove_libi_powerups.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove and verify Libi powerups
        run: python3 .github/scripts/crazy_family_remove_libi_powerups.py
      - name: Commit verified game
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add crazy-family.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove legacy Libi powerups"
          git push
