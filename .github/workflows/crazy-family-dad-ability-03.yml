name: Crazy Family Dad ability 3

on:
  push:
    paths:
      - 'crazy-family.html'
      - 'tests/crazy-family-dad-ability-03-wide-wave.test.js'
      - '.github/workflows/crazy-family-dad-ability-03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-wide-wave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Dad ability 3 wide wave
        run: node tests/crazy-family-dad-ability-03-wide-wave.test.js
