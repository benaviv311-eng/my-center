name: SeasonDesign CI

on:
  push:
    branches:
      - feature/season-design-foundation
    paths:
      - "season-design/**"
      - ".github/workflows/season-design-ci.yml"
  pull_request:
    paths:
      - "season-design/**"
      - ".github/workflows/season-design-ci.yml"

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: season-design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with diagnostics
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund --loglevel verbose
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== npm debug log ==="
            cat "$HOME"/.npm/_logs/*-debug-0.log || true
            exit "$status"
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
