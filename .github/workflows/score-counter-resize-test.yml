name: Score Counter resize test
on:
  push:
    branches: [main]
    paths:
      - 'score-counter/index.html'
      - 'score-counter/score-drag.js'
      - 'score-counter/score-resize.js'
      - 'score-counter/score-resize.css'
      - '.github/workflows/score-counter-resize-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify functional card shrinking and visible resize handles
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('score-counter/index.html','utf8');
          const js=fs.readFileSync('score-counter/score-resize.js','utf8');
          const css=fs.readFileSync('score-counter/score-resize.css','utf8');
          const missing=[];
          const requiredJs=[
            'MIN_SCALE_LIMIT=0.35',
            '--score-ui-scale',
            "card.querySelector('.score-controls')",
            "controls.querySelector('.score-btn.plus')",
            "controls.querySelector('.score-btn.minus')",
            "controls.querySelector('.score-btn.mega')",
            'controls.appendChild(plus)',
            'controls.appendChild(minus)',
            'controls.appendChild(mega)',
            'applyCardBox',
            'RESIZE_CORNERS',
            'pointerdown','pointermove','pointerup'
          ];
          for(const marker of requiredJs){if(!js.includes(marker)) missing.push('js:'+marker);}
          const requiredCss=[
            '.score-controls-composed',
            '.card[data-score-resize-ready="1"] .card-body',
            'transform:scale(var(--score-ui-scale,1))',
            'width:calc(100% / var(--score-ui-scale,1))',
            'opacity:.55',
            '.score-resize-handle[data-corner="top-left"]',
            '.score-resize-handle[data-corner="top-right"]',
            '.score-resize-handle[data-corner="bottom-left"]',
            '.score-resize-handle[data-corner="bottom-right"]'
          ];
          for(const marker of requiredCss){if(!css.includes(marker)) missing.push('css:'+marker);}
          if(js.includes('contentFloor=measureContentFloor(card)')) missing.push('resize still blocked by content floor');
          if(!index.includes('score-resize.js') || !index.includes('score-resize.css')) missing.push('loader assets');
          if(missing.length){
            console.error('Missing functional resize behavior:',missing.join(', '));
            process.exit(1);
          }
          console.log('Functional resize markers present.');
          NODE
          node --check score-counter/score-resize.js
