name: Score Counter fixed size test
on:
  push:
    branches: [main]
    paths:
      - 'score-counter/index.html'
      - 'score-counter/score-live.css'
      - 'score-counter/score-live.js'
      - '.github/workflows/score-counter-resize-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify resize UI is retired and cards use one fixed size
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('assert');
          const fs=require('fs');
          const index=fs.readFileSync('score-counter/index.html','utf8');
          const css=fs.readFileSync('score-counter/score-live.css','utf8');
          const js=fs.readFileSync('score-counter/score-live.js','utf8');
          assert(!index.includes('score-resize.js'),'resize JS must stay retired');
          assert(!index.includes('score-resize.css'),'resize CSS must stay retired');
          assert(!css.includes('.score-resize-handle'),'resize handle CSS must stay retired');
          assert(css.includes('width:240px!important'),'desktop cards need one fixed width');
          assert(css.includes('width:228px!important'),'mobile cards need one fixed width');
          assert(js.includes("card.querySelectorAll('.score-resize-handle,.score-size-menu').forEach(el=>el.remove())"),'cached resize controls must be cleaned up');
          NODE
          node --check score-counter/score-live.js
