name: Score Counter resize test
on:
  push:
    branches: [main]
    paths:
      - 'score-counter/index.html'
      - 'score-counter/score-drag.js'
      - 'score-counter/score-resize.js'
      - 'score-counter/score-resize.css'
      - '.github/workflows/score-counter-resize-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify compact text-fit score cards with professional resize presets
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('score-counter/index.html','utf8');
          const resize=fs.readFileSync('score-counter/score-resize.js','utf8');
          const drag=fs.readFileSync('score-counter/score-drag.js','utf8');
          const css=fs.readFileSync('score-counter/score-resize.css','utf8');
          const missing=[];

          const requiredResize=[
            "const RESIZE_CORNER='bottom-left'",
            'const PRESET_SCALES=[0.7,0.85,1,1.2,1.4]',
            'const COMPACT_MIN_WIDTH=180',
            'const COMPACT_MAX_WIDTH=320',
            'function measureTextFitWidth(card)',
            'function applyCompactBase(card)',
            "card.setAttribute('data-score-compact','1')",
            "card.style.setProperty('--score-card-fit-width'",
            'function applyScale(card,id,scale)',
            'function createPresetMenu(card,id,handle)',
            'data-score-preset',
            "translate3d('+Math.round(x)+'px,'+Math.round(y)+'px,0) scale('",
            'pointerdown','pointermove','pointerup'
          ];
          for(const marker of requiredResize){if(!resize.includes(marker)) missing.push('resize:'+marker);}

          const requiredCss=[
            '.card[data-score-compact="1"]',
            'width:var(--score-card-fit-width)',
            'height:auto!important',
            'min-height:0!important',
            'justify-self:start!important',
            'align-self:start!important',
            '.score-resize-handle[data-corner="bottom-left"]',
            '.score-size-menu',
            '.score-size-option',
            '.score-size-menu.open'
          ];
          for(const marker of requiredCss){if(!css.includes(marker)) missing.push('css:'+marker);}

          if(!drag.includes("scale('+scale.toFixed(3)+')")) missing.push('drag:translate and scale must be composed');
          if(resize.includes('composeScoreControls')) missing.push('resize:must not rearrange original card controls');
          if(resize.includes('score-controls-composed')) missing.push('resize:must not depend on composed controls');
          if(resize.includes('max-content')) missing.push('resize:must not use max-content measurement on whole card');
          if(resize.includes("card.style.height=")) missing.push('resize:must not rewrite card height');
          if(!index.includes('score-resize.js') || !index.includes('score-resize.css')) missing.push('loader assets');

          if(missing.length){
            console.error('Missing compact text-fit resize behavior:',missing.join(', '));
            process.exit(1);
          }
          console.log('Compact text-fit score card markers present.');
          NODE
          node --check score-counter/score-resize.js
          node --check score-counter/score-drag.js
