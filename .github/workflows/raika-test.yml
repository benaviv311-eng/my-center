name: Raika tests

on:
  push:
    branches:
      - main
      - 'feature/raika-*'
      - 'raika-*'
  pull_request:
    paths:
      - 'raika*.html'
      - 'raika-*.js'
      - 'raika-app.js'
      - 'styles.css'
      - 'tests/raika-*.test.js'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/raika-*.test.js
