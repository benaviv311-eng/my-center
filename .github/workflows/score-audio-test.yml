name: Score audio tests

on:
  push:
    paths:
      - 'score-counter/score-audio.js'
      - 'score-counter/score-audio.css'
      - 'score-counter/score-audio.test.js'
      - 'score-counter/index.html'
      - '.github/workflows/score-audio-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run score audio regression
        run: |
          node --check score-counter/score-audio.js
          node score-counter/score-audio.test.js
          node score-counter/score-live-regression.test.js
          node score-counter/score-layout-header-gap.test.js
