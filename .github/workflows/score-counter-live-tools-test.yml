name: Score Counter live tools test
on:
  push:
    branches: [main]
    paths:
      - 'score-counter/index.html'
      - 'score-counter/score-live-core.js'
      - 'score-counter/score-live.js'
      - 'score-counter/score-live.css'
      - '.github/workflows/score-counter-live-tools-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify timer and compact professional score card layout
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('assert');
          const fs=require('fs');
          const core=require('./score-counter/score-live-core.js');
          assert.equal(core.formatClock(0),'00:00');
          assert.equal(core.formatClock(61000),'01:01');
          assert.equal(core.formatClock(3599000),'59:59');
          assert.equal(core.isExplanatoryCopy('לחיצה על המספר לעריכה'),true);
          assert.equal(core.isExplanatoryCopy('הקש על הניקוד כדי לשנות'),true);
          assert.equal(core.isExplanatoryCopy('קבוצה א'),false);
          assert.equal(core.isExplanatoryCopy('12'),false);

          assert.equal(core.isScoreDeltaLabel('+1',1),true,'+1 must be recognized as the plus control');
          assert.equal(core.isScoreDeltaLabel('+',1),true,'+ must still be recognized');
          assert.equal(core.isScoreDeltaLabel('−1',-1),true,'−1 must be recognized as the minus control');
          assert.equal(core.isScoreDeltaLabel('-1',-1),true,'-1 must be recognized as the minus control');
          assert.equal(core.isScoreDeltaLabel('+5',1),false,'Mega +5 must not be mistaken for the normal plus control');

          const ui=fs.readFileSync('score-counter/score-live.js','utf8');
          const css=fs.readFileSync('score-counter/score-live.css','utf8');
          const index=fs.readFileSync('score-counter/index.html','utf8');

          for(const marker of [
            'score-live-timer',
            'data-timer-mode',
            'score-board-row',
            'score-board-value',
            'score-card-mega',
            'score-card-menu-toggle',
            'score-card-menu',
            'cleanExplanatoryCopy',
            'data-score-compact',
            'isScoreDeltaLabel'
          ]){
            assert(ui.includes(marker),`missing UI marker ${marker}`);
          }

          for(const marker of [
            '.score-live-timer',
            '.score-board-row',
            '.score-board-value',
            '.score-card-mega',
            '.score-card-menu-toggle',
            '.score-card-menu',
            'width:max-content!important',
            'min-width:0!important'
          ]){
            assert(css.includes(marker),`missing CSS marker ${marker}`);
          }

          assert(css.includes('.score-card-menu{\n  position:fixed;'),'score action list must open as a centered overlay');
          assert(css.includes('top:50%;\n  left:50%;'),'score action list must be centered in the viewport');
          assert(css.includes('transform:translate(-50%,-50%);'),'score action list must use centered transform');
          assert(css.includes('grid-template-columns:46px auto 46px;'),'desktop score row must not reserve a wide center track');
          assert(css.includes('gap:2px;'),'point controls must sit close to the score');
          assert(css.includes('.score-board-value{\n  width:max-content!important;\n  min-width:48px!important;'),'score value itself must shrink to its content');
          assert(css.includes('position:fixed'),'timer must be fixed at the top of the screen');
          assert(!ui.includes('score-rotation-chip'),'rotation UI must be removed');
          assert(!css.includes('.score-rotation-chip'),'rotation CSS must be removed');
          assert(index.includes('score-live-core.js'),'loader missing score-live-core.js');
          assert(index.includes('score-live.js'),'loader missing score-live.js');
          assert(index.includes('score-live.css'),'loader missing score-live.css');
          NODE
          node --check score-counter/score-live-core.js
          node --check score-counter/score-live.js
