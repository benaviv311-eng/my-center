name: Score Counter live tools test
on:
  push:
    branches: [main]
    paths:
      - 'score-counter/index.html'
      - 'score-counter/score-live-core.js'
      - 'score-counter/score-live.js'
      - 'score-counter/score-live.css'
      - '.github/workflows/score-counter-live-tools-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect legacy score markup
        shell: bash
        run: |
          python <<'PY'
          import base64, gzip, re
          payload=''.join(open(f'team-score/t{i}.txt',encoding='utf-8').read().strip() for i in range(1,5))
          html=gzip.decompress(base64.b64decode(payload)).decode('utf-8','replace')
          print('legacy html chars:',len(html))
          needles=['class="score"','score-btn','dataset.delta','closest(\'.score\')','classList.contains(\'score\')','addEventListener(\'change\'','addEventListener(\'input\'']
          for needle in needles:
              start=0
              for n in range(3):
                  pos=html.find(needle,start)
                  if pos<0: break
                  lo=max(0,pos-450); hi=min(len(html),pos+1300)
                  print(f'--- legacy snippet for {needle} #{n+1} ---')
                  print(re.sub(r'\s+',' ',html[lo:hi]))
                  start=pos+len(needle)
          PY
      - name: Verify timer and final unified score card layout
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('assert');
          const fs=require('fs');
          const core=require('./score-counter/score-live-core.js');
          assert.equal(core.formatClock(0),'00:00');
          assert.equal(core.formatClock(61000),'01:01');
          assert.equal(core.isExplanatoryCopy('לחיצה על המספר לעריכה'),true);
          assert.equal(core.isScoreDeltaLabel('+1',1),true);
          assert.equal(core.isScoreDeltaLabel('−1',-1),true);

          const ui=fs.readFileSync('score-counter/score-live.js','utf8');
          const css=fs.readFileSync('score-counter/score-live.css','utf8');
          const index=fs.readFileSync('score-counter/index.html','utf8');

          for(const marker of ['score-live-timer','score-board-row','score-board-value','score-card-mega','score-card-menu-toggle','score-final-column']){
            assert(ui.includes(marker),`missing UI marker ${marker}`);
          }

          assert(css.includes('#teams.score-final-column'),'teams need one explicit final column layout');
          assert(css.includes('flex-direction:column!important'),'teams must be a single vertical column');
          assert(css.includes('align-items:center!important'),'team cards must be centered horizontally');
          assert(css.includes('padding-top:50vh!important'),'team column must begin around the middle of the image');
          assert(css.includes('width:240px!important'),'desktop cards must share one stable width');
          assert(css.includes('grid-template-columns:46px minmax(48px,max-content) 46px;'),'score controls must stay tight around the score');
          assert(css.includes('gap:4px'),'score controls must be close and easy to use');

          assert(ui.includes("scoreDisplay.className='score-board-value'"),'score must use a new clean display node');
          assert(ui.includes("score.classList.add('score-board-source')"),'legacy score node must be retained only as a hidden data source');
          assert(ui.includes("row.appendChild(scoreDisplay)"),'clean score display must occupy the middle score cell');
          assert(ui.includes("new MutationObserver(syncScoreDisplay)"),'clean display must follow legacy score mutations');
          assert(!ui.includes("score.classList.add('score-board-value')"),'legacy score markup must never be reused as the visible center value');
          assert(css.includes('.score-board-source-host{'),'legacy score source needs a zero-size hidden host');
          assert(css.includes('.score-board-value{\n  position:static!important;'),'clean score value must sit normally between minus and plus');
          assert(css.includes('background:transparent!important'),'score value must not keep the legacy rectangle background');
          assert(css.includes('border:0!important'),'score value must not keep a legacy border');
          assert(css.includes('box-shadow:none!important'),'score value must not keep a legacy shadow');

          assert(!index.includes('score-resize.css'),'resize CSS must no longer be loaded');
          assert(!index.includes('score-resize.js'),'resize JS must no longer be loaded');
          assert(!css.includes('.score-resize-handle'),'final card UI must not expose resize handles');
          assert(!ui.includes('score-rotation-chip'),'rotation UI must stay removed');

          assert(css.includes('.score-card-menu{\n  position:fixed;'),'score action list must remain a centered overlay');
          assert(ui.includes('cloneNode(true)'),'secondary menu actions must keep proxy buttons');
          assert(ui.includes('original.click()'),'menu proxy must forward actions to original controls');
          assert(ui.includes("original.classList.add('score-card-action-original')"),'original actions must stay hidden in place');

          assert(index.includes('score-live-core.js'),'loader missing score-live-core.js');
          assert(index.includes('score-live.js'),'loader missing score-live.js');
          assert(index.includes('score-live.css'),'loader missing score-live.css');
          NODE
          node --check score-counter/score-live-core.js
          node --check score-counter/score-live.js
