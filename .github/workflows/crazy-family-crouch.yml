name: Crazy Family Crouch

on:
  push:
    paths:
      - '.github/workflows/crazy-family-crouch.yml'
      - '.github/scripts/crazy_family_crouch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add and verify crouch
        run: python3 .github/scripts/crazy_family_crouch.py
      - name: Commit verified game
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add crazy-family.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Libi crouch ability"
          git push
