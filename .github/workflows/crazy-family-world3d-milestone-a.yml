name: Crazy Family Living Room Final Art v1 acceptance

on:
  push:
    branches:
      - feature/livi-professional-home-native
  pull_request:
    paths:
      - 'crazy-family/**'
      - 'tests/crazy-family/**'
      - '.github/workflows/crazy-family-world3d-milestone-a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crazy Family node tests
        run: node --test tests/crazy-family/*.test.mjs
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/crazy-family-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/crazy-family.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/crazy-family-server.log
          exit 1
      - name: Existing cinematic browser smoke
        run: node tests/crazy-family/browser-smoke.mjs
      - name: Living Room Final Art v1 world3d browser smoke
        run: node tests/crazy-family/browser-world3d-smoke.mjs
      - name: Upload Living Room Final Art v1 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazy-family-living-room-final-art-v1
          path: artifacts/crazy-family-living-room-final-art-v1.png
          if-no-files-found: ignore
