name: Crazy Family v0.38 cinematic room

on:
  push:
    branches:
      - feature/crazy-family-cinematic-living-room-v038
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: v0.38 RED/GREEN acceptance
        run: python scripts/test-crazy-family-v038-cinematic-room.py
      - name: Existing movie-set static contract
        run: python scripts/test-crazy-family-movie-set.py
      - name: Movie-set node tests
        run: node --test tests/crazy-family/*.test.mjs
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/crazy-family-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/crazy-family.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/crazy-family-server.log
          exit 1
      - name: Real-browser movie-set acceptance
        run: node tests/crazy-family/browser-smoke.mjs
      - name: Upload rendered screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazy-family-v038-cinematic-room
          path: artifacts/crazy-family-movie-set.png
          if-no-files-found: ignore
