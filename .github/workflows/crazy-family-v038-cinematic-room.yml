name: Crazy Family v0.38 cinematic room

on:
  push:
    branches:
      - feature/crazy-family-cinematic-living-room-v038
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.38 version marker and render optimization
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html=Path('crazy-family.html')
          s=html.read_text(encoding='utf-8')
          if 'v0.38' not in s:
              s=s.replace('עולם הבית · שלב 1: מפגש אבא · v0.37','עולם הבית · שלב 1: מפגש אבא · v0.38',1)
          html.write_text(s,encoding='utf-8')

          scene=Path('crazy-family/scene.js')
          s=scene.read_text(encoding='utf-8')
          pattern=re.compile(r"  const cols=6,rows=15;.*?  rememberBase\(group\);",re.S)
          replacement="""  const cols=6,rows=15;
          const plankW=def.width/cols-0.055;
          const plankD=def.depth/rows-0.035;
          const plankColors=[0x9f714d,0x956746,0xaa7950,0x8e6144];
          const plankGeometry=new THREE.BoxGeometry(plankW,0.022,plankD);
          const plankMaterial=material(0xffffff,0.76);
          const planks=new THREE.InstancedMesh(plankGeometry,plankMaterial,cols*rows);
          semantic(planks,'wood-floor-planks');
          const dummy=new THREE.Object3D();
          let instance=0;
          for(let row=0;row<rows;row++){
            for(let col=0;col<cols;col++){
              dummy.position.set(
                -def.width/2+plankW/2+0.04+col*(def.width/cols),
                0.006,
                -def.depth/2+plankD/2+0.025+row*(def.depth/rows)
              );
              dummy.rotation.set(0,0,0);
              dummy.updateMatrix();
              planks.setMatrixAt(instance,dummy.matrix);
              planks.setColorAt(instance,new THREE.Color(plankColors[(row*3+col)%plankColors.length]));
              instance++;
            }
          }
          planks.instanceMatrix.needsUpdate=true;
          if(planks.instanceColor)planks.instanceColor.needsUpdate=true;
          planks.receiveShadow=true;
          planks.castShadow=false;
          group.add(planks);
          rememberBase(group);"""
          s,count=pattern.subn(replacement,s,count=1)
          if count!=1:
              raise SystemExit(f'floor optimization patch count={count}')
          s=s.replace('  practical.castShadow = true;','  practical.castShadow = false;',1)
          scene.write_text(s,encoding='utf-8')
          PY
      - name: v0.38 RED/GREEN acceptance
        run: python scripts/test-crazy-family-v038-cinematic-room.py
      - name: Existing movie-set static contract
        run: python scripts/test-crazy-family-movie-set.py
      - name: Movie-set node tests
        run: node --test tests/crazy-family/*.test.mjs
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/crazy-family-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/crazy-family.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/crazy-family-server.log
          exit 1
      - name: Real-browser movie-set acceptance
        run: node tests/crazy-family/browser-smoke.mjs
      - name: Upload rendered screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazy-family-v038-cinematic-room
          path: artifacts/crazy-family-movie-set.png
          if-no-files-found: ignore
      - name: Commit verified v0.38 room
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crazy-family.html crazy-family/scene.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: optimize Crazy Family cinematic room v0.38'
          git push origin HEAD:feature/crazy-family-cinematic-living-room-v038
