name: Crazy Family Simple Libi

on:
  push:
    paths:
      - '.github/workflows/crazy-family-simple-libi.yml'
      - '.github/scripts/crazy_family_simple_libi.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify and verify Libi controls
        run: python3 .github/scripts/crazy_family_simple_libi.py
      - name: Commit verified game
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add crazy-family.html
          git diff --cached --quiet && exit 0
          git commit -m "Simplify Libi to jump-only abilities"
          git push
