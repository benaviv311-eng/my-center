<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0b1220" />
<title>SeasonDesign</title>
<style>
:root{--bg:#07101f;--panel:#0e1b30;--panel2:#13233d;--line:#223654;--text:#f5f8ff;--muted:#9fb0ca;--accent:#65d8a8;--accent2:#83a8ff;--warn:#ffd166;--danger:#ff7c8c;--shadow:0 18px 60px rgba(0,0,0,.28);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#163152 0,#07101f 42%);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);background:rgba(7,16,31,.86);border-bottom:1px solid var(--line)}.topbar-inner{max-width:1320px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:18px}.brand{font-weight:900;font-size:22px;letter-spacing:.2px;white-space:nowrap}.brand span{color:var(--accent)}.nav{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 12px;border-radius:12px;white-space:nowrap}.nav button.active,.nav button:hover{color:var(--text);background:var(--panel2);border-color:var(--line)}.actions{margin-inline-start:auto;display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:12px;font-weight:700}.btn.primary{background:linear-gradient(135deg,var(--accent),#37b88a);border:0;color:#062018}.btn.ghost{background:transparent}.btn.danger{color:#ffdbe0}.shell{max-width:1320px;margin:auto;padding:28px 20px 80px}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-bottom:22px}.card{background:linear-gradient(180deg,rgba(19,35,61,.95),rgba(14,27,48,.95));border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.pad{padding:22px}.eyebrow{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:1.3px;font-weight:800}.title{font-size:36px;line-height:1.1;margin:8px 0 10px}.sub{color:var(--muted);line-height:1.7}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:rgba(7,16,31,.5);border:1px solid var(--line);border-radius:15px;padding:16px}.stat b{font-size:28px;display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:0 0 14px}.section-head h2{margin:0}.muted{color:var(--muted)}.empty{padding:34px;text-align:center;color:var(--muted)}.group-card h3,.exercise h3{margin:6px 0}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{font-size:12px;border:1px solid var(--line);background:#0a1628;color:#c6d4e8;border-radius:999px;padding:6px 9px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{color:#c8d5e8;font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;background:#081426;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent2)}textarea{min-height:90px;resize:vertical}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{background:#081426;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px}.practice-block{display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.practice-block:last-child{border:0}.minutes{font-size:24px;font-weight:900;color:var(--accent)}.exercise{padding:18px}.exercise p{color:var(--muted);line-height:1.5}.program-row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.program-row:last-child{border:0}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:20px;background:#10243d;border:1px solid #315175;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:30;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.mini{font-size:12px;color:var(--muted)}.danger-text{color:var(--danger)}.focus-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:7px 10px;border-radius:999px;margin:4px 0}.footer-note{margin-top:30px;font-size:12px;color:var(--muted);text-align:center}
@media(max-width:900px){.hero,.grid,.grid2,.split{grid-template-columns:1fr}.topbar-inner{align-items:flex-start;flex-wrap:wrap}.actions{margin-inline-start:0}.nav{order:3;width:100%}.form-grid{grid-template-columns:1fr}.title{font-size:30px}.practice-block{grid-template-columns:64px 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="topbar-inner"><div class="brand">Season<span>Design</span></div><nav class="nav" id="nav"></nav><div class="actions"><button class="btn ghost" id="exportBtn">ייצוא</button><label class="btn ghost" for="importFile">ייבוא</label><input id="importFile" type="file" accept="application/json" hidden></div></div></header>
<main class="shell" id="view"></main>
<div class="toast" id="toast"></div>
</div>
<script>
const STORE='seasonDesignBrowser_v1';
const SKILLS=['קבלה','הגשה','הנחתה','חסימה','הגנה','עילית','מעברים'];
const STAGES=[['isolated','מבודד'],['fixed','מקובע'],['complex','מורכב'],['game','מצבי משחק']];
const builtins=[
{title:'נפילה פסיבית → מוצא',skill:'קבלה',stage:'isolated',desc:'תרגול עמדת מוצא ושליטה בזווית הגוף לאחר נפילה.'},
{title:'קיר זוויות',skill:'קבלה',stage:'isolated',desc:'תחתית לקיר עם שינויי זווית ושליטה בפלטפורמה.'},
{title:'לאנץ תחתית בהחלפה',skill:'קבלה',stage:'fixed',desc:'תחתית לאחר לאנץ והחלפת רגליים, דגש על יציבות.'},
{title:'ספליט בהתקדמות',skill:'קבלה',stage:'fixed',desc:'תנועה, ספליט וקבלה תוך התקדמות.'},
{title:'קבלה למוסר קו אחורי/קדמי',skill:'קבלה',stage:'game',desc:'קבלת סרב למוסר במיקומים משתנים.'},
{title:'קבלת חור / פריבול',skill:'קבלה',stage:'game',desc:'זיהוי כדור חופשי וקבלת החלטה בתוך מבנה משחק.'},
{title:'עמידה + כף יד',skill:'הנחתה',stage:'isolated',desc:'עבודה נקייה על מגע בכדור וכף היד.'},
{title:'כניסה ללא כדור',skill:'הנחתה',stage:'isolated',desc:'תזמון צעדי ההרצה ללא עומס של כדור.'},
{title:'זריקה → הרצה → מכה',skill:'הנחתה',stage:'fixed',desc:'חיבור רציף של זריקה עצמית, הרצה ומכה.'},
{title:'הרצה, מאמן זורק',skill:'הנחתה',stage:'complex',desc:'הרצה מלאה לכדור משתנה שהמאמן מספק.'},
{title:'מחוץ למערכת — קרוב/רחוק',skill:'הנחתה',stage:'game',desc:'פתרון התקפה לכדורים מחוץ למערכת.'},
{title:'אחרי חסימה / הגנה',skill:'הנחתה',stage:'game',desc:'מעבר מהפעולה הקודמת לכניסה להתקפה.'},
{title:'סגירת חסימה',skill:'חסימה',stage:'isolated',desc:'עבודת רגליים וסגירת מרווח ידיים מעל הרשת.'},
{title:'חסימה מול התקפה',skill:'חסימה',stage:'complex',desc:'קריאת תוקף, תזמון וקפיצה מול התקפה חיה.'},
{title:'מטרות סרב',skill:'הגשה',stage:'fixed',desc:'סרבים לאזורים מסומנים עם ניקוד לפי דיוק.'},
{title:'סרב תחת לחץ',skill:'הגשה',stage:'game',desc:'סרב עם יעד וניקוד המדמה סוף מערכה.'},
{title:'תולעת דוחפת',skill:'הגנה',stage:'game',desc:'תרגיל הגנה רציף שמחייב תנועה, תקשורת והמשכיות.'},
{title:'משחקון 2×2 מלך המגרש',skill:'מעברים',stage:'game',desc:'משחקון קצר שמייצר הרבה נגיעות וקבלת החלטות.'}
];
function fresh(){return {groups:[],practices:[],programs:[],customExercises:[],createdAt:new Date().toISOString()}}
let state=load(); let page='home'; let lastPractice=null;
function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{return fresh()}}
function save(){localStorage.setItem(STORE,JSON.stringify(state));}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(v=''){return String(v).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]))}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
const navItems=[['home','בית'],['groups','קבוצות'],['practice','יצירת אימון'],['programs','תוכניות'],['library','ספרייה'],['draft','Coach Draft']];
function drawNav(){document.getElementById('nav').innerHTML=navItems.map(([k,l])=>`<button data-page="${k}" class="${page===k?'active':''}">${l}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function render(){drawNav();({home:homeView,groups:groupsView,practice:practiceView,programs:programsView,library:libraryView,draft:draftView}[page]||homeView)()}
function stageLabel(s){return STAGES.find(x=>x[0]===s)?.[1]||s}
function homeView(){
 const v=document.getElementById('view'); const latest=state.practices.slice(-3).reverse();
 v.innerHTML=`<section class="hero"><div class="card pad"><div class="eyebrow">עונת אימון חכמה</div><h1 class="title">מתכננים אימון לפי הקבוצה, לא לפי תבנית.</h1><p class="sub">SeasonDesign מרכז את הקבוצות, ספריית התרגילים, תוכניות העונה והמשוב במקום אחד. גרסת הדפדפן הזו שומרת את העבודה במכשיר שלך.</p><div class="toolbar" style="margin-top:18px"><button class="btn primary" id="goPractice">בנה אימון</button><button class="btn" id="goGroup">הוסף קבוצה</button></div></div><div class="card pad"><div class="stats"><div class="stat"><b>${state.groups.length}</b><span>קבוצות</span></div><div class="stat"><b>${state.practices.length}</b><span>אימונים</span></div><div class="stat"><b>${state.programs.length}</b><span>תוכניות</span></div><div class="stat"><b>${builtins.length+state.customExercises.length}</b><span>תרגילים</span></div></div></div></section>
 <div class="section-head"><h2>אימונים אחרונים</h2></div><section class="card pad">${latest.length?latest.map(p=>`<div class="program-row"><div><b>${esc(p.title)}</b><div class="mini">${esc(p.groupName)} · ${p.duration} דק׳ · ${esc(p.focuses.join(', '))}</div></div><span class="chip">${new Date(p.createdAt).toLocaleDateString('he-IL')}</span></div>`).join(''):'<div class="empty">עדיין אין אימונים שמורים.</div>'}</section><div class="footer-note">הנתונים נשמרים מקומית בדפדפן. מומלץ לבצע ייצוא גיבוי מדי פעם.</div>`;
 document.getElementById('goPractice').onclick=()=>{page='practice';render()};document.getElementById('goGroup').onclick=()=>{page='groups';render();setTimeout(()=>document.getElementById('newGroupName')?.focus(),0)}
}
function groupsView(){const v=document.getElementById('view');v.innerHTML=`<div class="section-head"><div><div class="eyebrow">Groups</div><h1>הקבוצות שלי</h1><p class="muted">רמה, כמות שחקנים והדגשים נשמרים לכל קבוצה בנפרד.</p></div></div>
<div class="split"><section><div class="grid2">${state.groups.map(g=>`<article class="card pad"><div class="eyebrow">${esc(g.age||'קבוצה')}</div><h3>${esc(g.name)}</h3><div class="chips"><span class="chip">${g.players||0} שחקנים</span><span class="chip">${esc(g.level)}</span></div><p class="muted">${esc(g.notes||'ללא הערות')}</p><div class="toolbar"><button class="btn" data-edit="${g.id}">עריכה</button><button class="btn danger" data-del="${g.id}">מחיקה</button></div></article>`).join('')||'<div class="card empty">עדיין אין קבוצות.</div>'}</div></section>
<section class="card pad"><div class="eyebrow">קבוצה חדשה</div><h2>פרופיל קבוצה</h2><form id="groupForm" class="form-grid"><div class="field full"><label>שם הקבוצה</label><input id="newGroupName" name="name" required placeholder="למשל: U15 ברנר"></div><div class="field"><label>גיל / כיתה</label><input name="age" placeholder="U15 / ח׳"></div><div class="field"><label>מספר שחקנים</label><input name="players" type="number" min="1" value="12"></div><div class="field"><label>רמה כללית</label><select name="level"><option>מתחילים</option><option selected>בינוניים</option><option>מתקדמים</option><option>עילית</option></select></div><div class="field full"><label>הערות ודגשים</label><textarea name="notes" placeholder="קושי בקבלת סרב, רשת נמוכה, 2 מגרשים..."></textarea></div><div class="field full"><button class="btn primary">שמור קבוצה</button></div></form></section></div>`;
 document.getElementById('groupForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.groups.push({id:id(),name:f.get('name').trim(),age:f.get('age').trim(),players:+f.get('players')||12,level:f.get('level'),notes:f.get('notes').trim()});save();toast('הקבוצה נשמרה');groupsView()};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.groups=state.groups.filter(g=>g.id!==b.dataset.del);save();groupsView()});
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const g=state.groups.find(x=>x.id===b.dataset.edit);if(!g)return;const n=prompt('שם הקבוצה',g.name);if(n){g.name=n.trim();save();groupsView()}})
}
function pickExercises(focus,count=2){const all=[...builtins,...state.customExercises];let arr=all.filter(e=>focus.includes(e.skill));if(!arr.length)arr=all;return arr.sort(()=>Math.random()-.5).slice(0,count)}
function generatePractice(form){const dur=+form.duration||90;const focuses=form.focuses.length?form.focuses:['קבלה'];const style=form.style;let warm=Math.max(8,Math.round(dur*.18));let game=Math.max(10,Math.round(dur*(style==='משחקי'?.3:.2)));let tech=dur-warm-game;const blocks=[{name:'חימום + תנועה',minutes:warm,desc:'חימום דינמי עם כדור, תנועה והכנה ספציפית לאימון.'}];const per=Math.floor(tech/focuses.length);let rem=tech;
 focuses.forEach((f,i)=>{const mins=i===focuses.length-1?rem:per;rem-=mins;const ex=pickExercises([f],2);blocks.push({name:f,minutes:mins,desc:ex.map(x=>x.title).join(' → ')||'תרגול מדורג לפי רמת הקבוצה'})});
 blocks.push({name:'משחק / יישום',minutes:game,desc:style==='טכני'?'משחקון עם תנאי שמחזק את נושאי האימון.':'משחק תחרותי עם ניקוד על הדגשים המרכזיים.'});
 const total=blocks.reduce((a,b)=>a+b.minutes,0);if(total!==dur)blocks[blocks.length-1].minutes+=dur-total;return {id:id(),title:`אימון ${focuses.join(' + ')}`,groupId:form.groupId,groupName:state.groups.find(g=>g.id===form.groupId)?.name||'קבוצה זמנית',duration:dur,style,focuses,blocks,createdAt:new Date().toISOString()}}
function practiceView(){const v=document.getElementById('view');v.innerHTML=`<div class="section-head"><div><div class="eyebrow">Create Practice</div><h1>בניית אימון</h1><p class="muted">בחר קבוצה, זמן ועד שלושה נושאים. המערכת מחלקת את הזמן בדיוק.</p></div></div><div class="split"><section class="card pad"><form id="practiceForm" class="form-grid"><div class="field full"><label>קבוצה</label><select name="groupId"><option value="">קבוצה זמנית</option>${state.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div class="field"><label>משך</label><select name="duration"><option>45</option><option>60</option><option>75</option><option selected>90</option><option>105</option><option>120</option></select></div><div class="field"><label>אופי אימון</label><select name="style"><option>רגיל</option><option>טכני</option><option>משחקי</option><option>מתקדם</option></select></div><div class="field full"><label>מוקדים — עד 3</label><div class="chips" id="focusBox">${SKILLS.map(s=>`<label class="focus-pill"><input type="checkbox" value="${s}"> ${s}</label>`).join('')}</div></div><div class="field full"><button class="btn primary">צור אימון</button></div></form></section><section id="practiceResult">${lastPractice?practiceMarkup(lastPractice):'<div class="card empty">האימון שייווצר יוצג כאן.</div>'}</section></div>`;
 document.getElementById('practiceForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const focuses=[...document.querySelectorAll('#focusBox input:checked')].map(x=>x.value).slice(0,3);lastPractice=generatePractice({groupId:f.get('groupId'),duration:f.get('duration'),style:f.get('style'),focuses});document.getElementById('practiceResult').innerHTML=practiceMarkup(lastPractice);wirePracticeSave()};wirePracticeSave()}
function practiceMarkup(p){return `<article class="card pad"><div class="section-head"><div><div class="eyebrow">${esc(p.groupName)}</div><h2>${esc(p.title)}</h2><div class="mini">${p.duration} דקות · ${esc(p.style)}</div></div><button class="btn primary" id="savePractice">שמור</button></div>${p.blocks.map((b,i)=>`<div class="practice-block"><div class="minutes">${b.minutes}<small style="font-size:11px;display:block;color:var(--muted)">דק׳</small></div><div><b>${i+1}. ${esc(b.name)}</b><div class="muted">${esc(b.desc)}</div></div><span class="chip">${i===0?'חימום':i===p.blocks.length-1?'יישום':'טכניקה'}</span></div>`).join('')}<div class="mini">סה״כ: ${p.blocks.reduce((a,b)=>a+b.minutes,0)} דקות</div></article>`}
function wirePracticeSave(){const b=document.getElementById('savePractice');if(b&&lastPractice)b.onclick=()=>{state.practices.push(lastPractice);save();toast('האימון נשמר')}}
function programsView(){const v=document.getElementById('view');v.innerHTML=`<div class="section-head"><div><div class="eyebrow">Programs</div><h1>תוכניות אימון</h1><p class="muted">בנה רצף אימונים לפי קבוצה ומוקד.</p></div></div><div class="split"><section class="card pad"><form id="programForm" class="form-grid"><div class="field full"><label>קבוצה</label><select name="groupId" required><option value="">בחר</option>${state.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div class="field"><label>מספר אימונים</label><input name="count" type="number" min="2" max="30" value="8"></div><div class="field"><label>משך כל אימון</label><select name="duration"><option>60</option><option>75</option><option selected>90</option></select></div><div class="field full"><label>מוקד מרכזי</label><select name="focus">${SKILLS.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field full"><button class="btn primary">צור תוכנית</button></div></form></section><section class="card pad"><h2>התוכניות שלי</h2>${state.programs.map(p=>`<div class="program-row"><div><b>${esc(p.groupName)} — ${esc(p.focus)}</b><div class="mini">${p.sessions.length} אימונים · ${p.duration} דק׳</div></div><button class="btn danger" data-pdel="${p.id}">מחיקה</button></div>`).join('')||'<div class="empty">אין תוכניות עדיין.</div>'}</section></div>`;
 document.getElementById('programForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),g=state.groups.find(x=>x.id===f.get('groupId'));if(!g)return toast('בחר קבוצה');const count=Math.min(30,Math.max(2,+f.get('count')||8)),focus=f.get('focus'),duration=+f.get('duration');const stages=['isolated','fixed','complex','game'];const sessions=Array.from({length:count},(_,i)=>({n:i+1,stage:stages[Math.min(3,Math.floor(i/count*4))],focus}));state.programs.push({id:id(),groupId:g.id,groupName:g.name,focus,duration,sessions,createdAt:new Date().toISOString()});save();toast('התוכנית נשמרה');programsView()};document.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{state.programs=state.programs.filter(p=>p.id!==b.dataset.pdel);save();programsView()})}
function libraryView(){const v=document.getElementById('view');const all=[...builtins,...state.customExercises];v.innerHTML=`<div class="section-head"><div><div class="eyebrow">Library</div><h1>ספריית תרגילים</h1><p class="muted">מאגר לפי מיומנות ושלב התקדמות.</p></div></div><div class="toolbar"><input id="libSearch" placeholder="חיפוש"><select id="libSkill"><option value="">כל המיומנויות</option>${SKILLS.map(s=>`<option>${s}</option>`).join('')}</select><select id="libStage"><option value="">כל השלבים</option>${STAGES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select></div><section class="grid" id="libGrid"></section>`;
 function paint(){const q=document.getElementById('libSearch').value.trim(),skill=document.getElementById('libSkill').value,stage=document.getElementById('libStage').value;const arr=all.filter(e=>(!q||(e.title+' '+e.desc).includes(q))&&(!skill||e.skill===skill)&&(!stage||e.stage===stage));document.getElementById('libGrid').innerHTML=arr.map(e=>`<article class="card exercise"><div class="eyebrow">${esc(e.skill)}</div><h3>${esc(e.title)}</h3><p>${esc(e.desc)}</p><div class="chips"><span class="chip">${stageLabel(e.stage)}</span>${e.custom?'<span class="chip">שלי</span>':''}</div></article>`).join('')||'<div class="card empty">לא נמצאו תרגילים.</div>'}
 ['libSearch','libSkill','libStage'].forEach(x=>document.getElementById(x).oninput=paint);paint()}
function draftView(){const v=document.getElementById('view');v.innerHTML=`<div class="section-head"><div><div class="eyebrow">Coach Draft</div><h1>לוח בניית תרגילים</h1><p class="muted">צור תרגיל משלך והוסף אותו מיד לספרייה.</p></div></div><div class="split"><section class="card pad"><form id="draftForm" class="form-grid"><div class="field full"><label>שם התרגיל</label><input name="title" required placeholder="למשל: קבלה + מעבר להתקפה"></div><div class="field"><label>מיומנות</label><select name="skill">${SKILLS.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>שלב</label><select name="stage">${STAGES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select></div><div class="field full"><label>תיאור / זרימה / דגשים</label><textarea name="desc" required></textarea></div><div class="field full"><button class="btn primary">שמור לספרייה</button></div></form></section><section class="card pad"><h2>תרגילים שיצרת</h2>${state.customExercises.map(e=>`<div class="program-row"><div><b>${esc(e.title)}</b><div class="mini">${esc(e.skill)} · ${stageLabel(e.stage)}</div></div><button class="btn danger" data-edel="${e.id}">מחיקה</button></div>`).join('')||'<div class="empty">עדיין לא יצרת תרגילים.</div>'}</section></div>`;
 document.getElementById('draftForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.customExercises.push({id:id(),custom:true,title:f.get('title').trim(),skill:f.get('skill'),stage:f.get('stage'),desc:f.get('desc').trim()});save();toast('התרגיל נוסף לספרייה');draftView()};document.querySelectorAll('[data-edel]').forEach(b=>b.onclick=()=>{state.customExercises=state.customExercises.filter(e=>e.id!==b.dataset.edel);save();draftView()})}

document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='season-design-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());state={...fresh(),...data};save();render();toast('הגיבוי יובא')}catch{toast('קובץ גיבוי לא תקין')}};
render();
</script>
</body>
</html>
